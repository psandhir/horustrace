freeze_rules:
  minimum_target_cases: 20
  desired_provider_distribution:
    gcp: 4
    aws: 5
    azure: 5
    kubernetes: 6
  include_only_if:
    - workload identity is source-proven at a pinned commit
    - workload is meaningfully related to an AI/agent application or agent-serving component
    - expected identity can be adjudicated without HorusTrace output
    - dynamic or computed references are allowed only when truth records the exact source-level resolution chain
  exclude_if:
    - only repository name or README claims deployment identity
    - runtime identity requires a live cloud or cluster query
    - case is substantially duplicated from deployment-authority-v08 frozen cohort
    - truth would depend on HorusTrace output

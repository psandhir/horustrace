name: Unseen Generalization Cohort

on:
  workflow_dispatch:
  push:
    branches:
      - research/unseen-generalization-cohort-2026
    paths:
      - ".github/workflows/unseen-generalization-cohort.yml"
      - "research/unseen-generalization-cohort-2026/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: unseen-generalization-cohort
  cancel-in-progress: true

jobs:
  scan:
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        case_id:
          - ug-001
          - ug-002
          - ug-003
          - ug-004
          - ug-005
          - ug-006
          - ug-007
          - ug-008
          - ug-009
          - ug-010
          - ug-011
          - ug-012
          - ug-013
          - ug-014
          - ug-015
          - ug-016
          - ug-017
          - ug-018
          - ug-019
          - ug-020

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HorusTrace
        run: python -m pip install --disable-pip-version-check .

      - name: Scan pinned unseen repository
        run: python research/unseen-generalization-cohort-2026/run_case.py --case-id "${{ matrix.case_id }}" --output-dir artifacts

      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unseen-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate unseen cohort
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: unseen-case-*
          path: downloaded

      - name: Aggregate
        run: |
          python research/unseen-generalization-cohort-2026/aggregate.py --input downloaded --output aggregate
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: unseen-generalization-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

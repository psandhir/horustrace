name: ADK Depth Parity 15 Current Regression

on:
  workflow_dispatch:
  push:
    branches:
      - research/adk-regression-current-20261007
    paths:
      - ".github/workflows/adk-depth-parity-current-regression.yml"
      - "research/google-adk-depth-parity-15/**"
      - "src/horustrace/adapters/google_adk.py"
      - "src/horustrace/effective_authority.py"
      - "src/horustrace/scanner.py"
      - "tests/test_google_adk.py"
  pull_request:
    paths:
      - ".github/workflows/google-adk-depth-parity-15.yml"
      - "research/google-adk-depth-parity-15/**"
      - "src/horustrace/adapters/google_adk.py"
      - "src/horustrace/effective_authority.py"
      - "src/horustrace/scanner.py"
      - "tests/test_google_adk.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: adk-depth-parity-current-regression
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Run Google ADK depth-parity study
        run: |
          python research/google-adk-depth-parity-15/run.py
          cat artifacts/google-adk-depth-parity-15/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload study result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-adk-depth-parity-15
          path: artifacts/google-adk-depth-parity-15/
          if-no-files-found: error
          retention-days: 30

name: Wave B540 Current Graph ADG Pilot Differential

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/wave-b540-current-pilot-graph.yml"
      - "scripts/reconcile_wave_b540_pilot_graph.py"
      - "tests/test_wave_b540_pilot_graph.py"
      - "research/accuracy-wave-b540-four-pilot-20261017/source-edge-ledger.json"
      - "docs/wave-b540-current-graph-source-parity-20261018.md"

permissions:
  contents: read

concurrency:
  group: wave-b540-current-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-case:
    name: ${{ matrix.case_id }} scanner/Graph/ADG source differential
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - case_id: gen-pyd-001
            repo: newsbubbles/pharmiq
            sha: c69949739647a47ec8339b473bdf578c8cf8bfd9
          - case_id: ff60-microsoft-04
            repo: qmatteoq/agent365-demos
            sha: 937f8c12421b6eebfbff764dbafbdbe13cc72f68
          - case_id: gen-mcp-003
            repo: couchbase/mcp-server-couchbase
            sha: df5d9ceb013f57143171f65ec3ba033ace06aa9a
          - case_id: ff60-amazon-04
            repo: aws-samples/sample-multi-agent-region-expansion-planner
            sha: 30d03d7c9f6512e5bf10601879382fac9c3a16b1
          - case_id: gen-mcp-001
            repo: stickerdaniel/linkedin-mcp-server
            sha: f1425029ca426e850dc9f52b0097f0fff1aa7b3d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install scanner only, never target dependencies
        run: python -m pip install -e . 'pytest>=8,<9'
      - name: Verify source discrepancy fixture and negative label contract
        run: python -m pytest -q tests/test_wave_b540_pilot_graph.py
      - name: Retrieve immutable case source
        shell: bash
        env:
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          mkdir -p target
          git -C target init -q
          git -C target remote add origin "https://github.com/$TARGET_REPO.git"
          git -C target fetch --quiet --depth=1 --filter=blob:none origin "$TARGET_SHA"
          git -C target checkout --quiet --detach FETCH_HEAD
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
      - name: Compare current Graph/ADG to pinned source ledger, preserving hard negatives
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          set -euo pipefail
          python -m scripts.reconcile_wave_b540_pilot_graph \
            --case-id "$CASE_ID" \
            --source target \
            --ledger research/accuracy-wave-b540-four-pilot-20261017/source-edge-ledger.json \
            --output "evaluation/$CASE_ID.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        if: always()
        with:
          name: wave-b540-graph-evidence-${{ matrix.case_id }}
          path: evaluation/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Five-case pinned Graph/ADG evidence integrity
    if: always()
    needs: pinned-case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wave-b540-graph-evidence-*
          path: downloaded
      - name: Validate five exact source pins and make release blocker visible
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = {
              "gen-pyd-001", "ff60-microsoft-04", "gen-mcp-003",
              "ff60-amazon-04", "gen-mcp-001",
          }
          files = sorted(Path("downloaded").glob("**/*.json"))
          rows = [json.loads(p.read_text(encoding="utf-8")) for p in files]
          case_ids = [r["case_id"] for r in rows]
          if len(rows) != 5 or set(case_ids) != expected:
              raise SystemExit(f"pinned source case coverage incomplete: {case_ids}")
          if any(r["wave_b_go"] or r["wave_c_go"] or
                 r["runtime_effectiveness_verified"] or
                 r["exhaustive_negative_label_universe"] or
                 r["source_precision"] is not None for r in rows):
              raise SystemExit("source diagnostic incorrectly claims release certification")
          lines = [
              "## Wave B five-pilot current Graph/ADG differential",
              "Source candidates are not independently labelled TP/FP; "
              "dynamic and deployed runtime authority remain UNKNOWN.",
              "| Case | Graph agents | Source-native missing symbols | Findings | Paths |",
              "|---|---:|---:|---:|---:|",
          ]
          for row in sorted(rows, key=lambda r: r["case_id"]):
              m = row["scanner"]
              lines.append(
                  f"| {row['case_id']} | {m['agent_count']} | "
                  f"{len(row['source_native_candidate_missing'])} | "
                  f"{m['findings_count']} | {m['potential_attack_paths']} |"
              )
          lines.append("**Wave B release NO-GO: independent exhaustive negatives, "
                       "effective authority, and per-finding/path adjudication still required.**")
          text = "\n".join(lines) + "\n"
          Path("five-pilot-summary.md").write_text(text, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(text)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        if: always()
        with:
          name: wave-b540-graph-evidence-five-case-summary
          path: five-pilot-summary.md
          if-no-files-found: error
          retention-days: 30

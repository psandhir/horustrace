name: Generate AI Companion visual report post-203

on:
  push:
    branches:
      - experiment/visual-report-ai-companion-post203

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HorusTrace
        uses: actions/checkout@v4

      - name: Check out target repository at study SHA
        uses: actions/checkout@v4
        with:
          repository: Danejw/ai-companion-backend
          ref: 5868863046a6b3e69cba9d07e98fb2bd357976d1
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HorusTrace
        run: python -m pip install -e .

      - name: Run JSON scan
        shell: bash
        run: |
          set +e
          horustrace scan target --format json > ai-companion-scan-post203.json 2> ai-companion-scan-post203.stderr
          code=$?
          echo "scan_exit_code=$code"
          cat ai-companion-scan-post203.stderr
          exit 0

      - name: Summarize scan and key deltas
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          data=json.load(open("ai-companion-scan-post203.json"))
          s=data.get("summary", {})
          authority=data.get("effective_authority", {})
          asum=authority.get("summary", {})
          relationships=authority.get("relationships", [])
          findings=data.get("findings", [])
          attack_paths=data.get("attack_paths", [])
          graph=data.get("graph", {})

          print("summary:", s)
          print("authority_summary:", asum)
          print("graph_agents:", len(graph.get("agents", [])))
          print("findings:", len(findings))
          print("severity:", dict(Counter(item.get("severity") for item in findings)))
          print("rules:", dict(Counter(item.get("rule_id") for item in findings)))
          print("attack_paths:", len(attack_paths))
          print("attack_path_rules:", dict(Counter(item.get("path_id") for item in attack_paths)))
          mcp=[r for r in relationships if (r.get("target") or {}).get("kind")=="mcp_server"]
          print("effective_mcp_relationships:", len(mcp))
          for item in mcp:
              print("MCP_REL", item.get("agent"), item.get("target"), item.get("capabilities"), item.get("tool_scope"))
          for item in attack_paths:
              print("PATH", item.get("path_id"), item.get("agent"), item.get("nodes"), item.get("metadata"))
          PY

      - name: Generate visual report
        run: horustrace report target --output ai-companion-horustrace-report-post203.html

      - name: Verify report contains new visualized evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("ai-companion-horustrace-report-post203.html").read_text(encoding="utf-8")
          checks = {
              "Discord MCP": "discord_mcp" in text,
              "Memory Graph MCP": "Memory Graph" in text,
              "Attack path UI": "Attack paths" in text,
              "PATH008": "PATH008" in text,
              "PATH009": "PATH009" in text,
              "potential path label": "Potential capability path" in text,
              "expandable map": "Expand map" in text,
          }
          for key,value in checks.items():
              print(f"{key}: {value}")
          missing=[key for key,value in checks.items() if not value]
          if missing:
              raise SystemExit("report missing expected content: "+", ".join(missing))
          PY

      - name: Upload report and scan
        uses: actions/upload-artifact@v4
        with:
          name: ai-companion-horustrace-visual-report-post203
          path: |
            ai-companion-horustrace-report-post203.html
            ai-companion-scan-post203.json
            ai-companion-scan-post203.stderr

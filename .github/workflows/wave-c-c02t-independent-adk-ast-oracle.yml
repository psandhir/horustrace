name: Wave C C02t Independent Google ADK AST Source Oracle

on:
  pull_request:
    paths:
      - "src/horustrace/source_truth_ast_adk.py"
      - "scripts/wave_c_c02t_independent_ast_adk_study.py"
      - "tests/test_wave_c_c02t_ast_adk_oracle.py"
      - "docs/accuracy/wave-c-c02t-independent-ast-adk-oracle.md"
      - ".github/workflows/wave-c-c02t-independent-adk-ast-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-c-c02t-adk-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-source-oracle:
    name: Pinned rw005 independent ADK source AST and hard negatives
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install scanner and test independent source AST hard negatives
        run: |
          python -m pip install -e . 'pytest>=8.3,<9'
          python -m pytest -q tests/test_wave_c_c02t_ast_adk_oracle.py
      - name: Fetch exact pinned public source without executing target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pinned-target
          git -C pinned-target init -q
          git -C pinned-target remote add origin "https://github.com/Ojas-Patil26/VeriQ.git"
          git -C pinned-target fetch --quiet --depth=1 --filter=blob:none origin 067cb330ab943279b4b8ea13c91c9042bdd9f421
          git -C pinned-target checkout --quiet --detach FETCH_HEAD
          test "$(git -C pinned-target rev-parse HEAD)" = "067cb330ab943279b4b8ea13c91c9042bdd9f421"
      - name: Validate five constructors four delegations and eight direct tool witnesses
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.wave_c_c02t_independent_ast_adk_study \
            --checkout pinned-target \
            --output artifacts
      - name: Upload bounded source-oracle and scanner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wave-c-c02t-rw005-independent-ast-oracle
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

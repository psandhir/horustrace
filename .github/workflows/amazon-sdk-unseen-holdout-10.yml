name: Amazon SDK Unseen Holdout 10

on:
  workflow_dispatch:
  push:
    branches:
      - research/amazon-sdk-unseen-holdout-10
    paths:
      - ".github/workflows/amazon-sdk-unseen-holdout-10.yml"
      - "research/amazon-sdk-unseen-holdout-10/**"
  pull_request:
    paths:
      - ".github/workflows/amazon-sdk-unseen-holdout-10.yml"
      - "research/amazon-sdk-unseen-holdout-10/**"
      - "src/horustrace/adapters/amazon_agentic.py"
      - "src/horustrace/adapters/repository_adk.py"
      - "src/horustrace/strands_repository.py"
      - "src/horustrace/scanner.py"
      - "tests/test_amazon_agentic.py"
      - "scripts/audit_wave_b540_imported_tool_truth.py"
      - "tests/test_wave_b540_imported_tool_truth.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: amazon-sdk-unseen-holdout-10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case_id:
          - amazon-hold-001
          - amazon-hold-002
          - amazon-hold-003
          - amazon-hold-004
          - amazon-hold-005
          - amazon-hold-006
          - amazon-hold-007
          - amazon-hold-008
          - amazon-hold-009
          - amazon-hold-010

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Generate frozen scan bundle
        run: |
          python research/amazon-sdk-unseen-holdout-10/run_case.py \
            --case-id "${{ matrix.case_id }}" \
            --output-dir artifacts
      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amazon-sdk-holdout-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate Amazon SDK holdout
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: amazon-sdk-holdout-case-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate
        run: |
          python research/amazon-sdk-unseen-holdout-10/aggregate.py --input downloaded --output aggregate
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Audit WAB-04 pinned external tool contracts (source-only)
        run: |
          set -euo pipefail
          mkdir -p "pinned-source"
          # Fetch an immutable application source, never install or execute its dependencies.
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/aws-samples/sample-multi-agent-region-expansion-planner/30d03d7c9f6512e5bf10601879382fac9c3a16b1/requirements.txt" \
            -o pinned-source/requirements.txt
          python scripts/audit_wave_b540_imported_tool_truth.py \
            --case-json downloaded/amazon-sdk-holdout-case-amazon-hold-004/result.json \
            --requirements pinned-source/requirements.txt \
            --output aggregate/amazon-hold-004-source-tool-truth.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("aggregate/amazon-hold-004-source-tool-truth.json").read_text())
          if report["wave_c_go"] is not False or report["installed_tool_implementation_verified"] is not False:
              raise SystemExit("Do not promote unresolved external tool effects to certified runtime authority")
          lines = [
              "",
              "### WAB-04 source-only imported-tool audit",
              f"Imported Strands-tool occurrences: {report['imported_vended_tool_occurrences']}",
              f"Package declaration: {report['source_dependency_declaration']}",
              f"Finding provenance origins: {report['provenance_fact_origins']}",
              "**Runtime tool effects, approvals and independent accuracy remain unverified.**",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\\n".join(lines) + "\\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amazon-sdk-unseen-holdout-10-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

name: Wave C C02r MCP Source Implementation Shadow

on:
  pull_request:
    paths:
      - "src/horustrace/mcp_source_implementation_shadow.py"
      - "src/horustrace/source_shadow_html.py"
      - "tests/test_source_shadow_html.py"
      - "docs/accuracy/wave-c-c02v-offline-source-supply-chain-explorer.md"
      - "tests/test_mcp_source_implementation_shadow.py"
      - "scripts/wave_c_c02r_pinned_mcp_shadow_study.py"
      - "docs/accuracy/wave-c-c02r-mcp-source-implementation-shadow.md"
      - ".github/workflows/wave-c-c02r-mcp-source-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-c-c02r-mcp-source-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-shadow:
    name: Pinned rw080 MCP source shadow and hard negatives
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install scanner only and test shadow negative controls
        run: |
          python -m pip install -e . 'pytest>=8.3,<9'
          python -m pytest -q tests/test_mcp_source_implementation_shadow.py tests/test_source_shadow_html.py
      - name: Fetch pinned source repository without executing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pinned-target
          git -C pinned-target init -q
          git -C pinned-target remote add origin "https://github.com/Amlan66/SSEEnabledMCPAgent.git"
          git -C pinned-target fetch --quiet --depth=1 --filter=blob:none origin 11531239e71b123f25b3c6103ee36a9d614d0032
          git -C pinned-target checkout --quiet --detach FETCH_HEAD
          test "$(git -C pinned-target rev-parse HEAD)" = "11531239e71b123f25b3c6103ee36a9d614d0032"
      - name: Verify source ADG shadow restores 3 distinct implementations and 25 source tool sites
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.wave_c_c02r_pinned_mcp_shadow_study \
            --checkout pinned-target \
            --output artifacts
      - name: Generate opt-in offline source supply-chain HTML (no runtime permissions)
        shell: bash
        run: |
          set -euo pipefail
          python -m horustrace.source_shadow_html \
            --input artifacts/source-shadow.json \
            --output artifacts/mcp-source-supply-chain.html
          test -s artifacts/mcp-source-supply-chain.html
      - name: Publish exact pinned source-only shadow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wave-c-c02r-rw080-source-shadow
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

name: Truly Fresh ADK Pydantic Holdout 10

on:
  push:
    branches:
      - fix/adk-pydantic-p0-p1-study
    paths:
      - ".github/workflows/truly-fresh-adk-pydantic-holdout-10.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: truly-fresh-adk-pydantic-holdout-10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCANNER_SHA: e0639c218867d3f2f4adc315831c48f4a7f59e68
      STUDY_ROOT: /tmp/truly-fresh-adk-pydantic-holdout-10
      OUT_DIR: research/truly-fresh-adk-pydantic-holdout-10

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze never-before-cohort repos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STUDY_ROOT" "$OUT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["STUDY_ROOT"])
          out = Path(os.environ["OUT_DIR"])
          cases = [
              {
                  "case_id": "fresh-001",
                  "repo": "AbiramiSukumaran/adk-renovation-single-agent",
                  "sha": "f1b779be5d1d49093b46102a8440d26830efa07d",
                  "application_path": "agent.py",
                  "framework_stratum": "google-adk",
                  "signals": ["external_write_or_network", "state_mutation"],
              },
              {
                  "case_id": "fresh-002",
                  "repo": "AbiramiSukumaran/renovation-agent-adk-mcp-toolbox",
                  "sha": "8c0aed21d68d865254b65e667b764fc31af25781",
                  "application_path": "agent.py",
                  "framework_stratum": "google-adk",
                  "signals": ["external_write_or_network"],
              },
              {
                  "case_id": "fresh-003",
                  "repo": "amiitt001/adk-hiring-agent",
                  "sha": "7232ba30820c0370634b97142b0bb72c32d9d065",
                  "application_path": "agent.py",
                  "framework_stratum": "google-adk",
                  "signals": ["multiple_trust_boundaries"],
              },
              {
                  "case_id": "fresh-004",
                  "repo": "pruthvikrishnang/customer-support-agent",
                  "sha": "493a0dc06e4f45ca6471a7d6e376fbf555b8bdd1",
                  "application_path": "app/agent.py",
                  "framework_stratum": "google-adk",
                  "signals": ["multiple_trust_boundaries"],
              },
              {
                  "case_id": "fresh-005",
                  "repo": "GothiProCoder/Multi-Agent-System-Google-ADK",
                  "sha": "713cd35bf3759becc84ef6bf8958953df3d3f272",
                  "application_path": "agent.py",
                  "framework_stratum": "google-adk",
                  "signals": ["multiple_trust_boundaries"],
              },
              {
                  "case_id": "fresh-006",
                  "repo": "mindeye33/speedagent",
                  "sha": "cc42c792ffac8e3c6ee7679dd3eff6f2f84d7c59",
                  "application_path": "agent.py",
                  "framework_stratum": "pydantic-ai",
                  "signals": ["process_execution", "browser_or_web_access"],
              },
              {
                  "case_id": "fresh-007",
                  "repo": "newsbubbles/youtube-manager-mcp",
                  "sha": "b429601aa96fa4497084e43863a288c6353de59e",
                  "application_path": "agent.py",
                  "framework_stratum": "pydantic-ai",
                  "signals": ["mcp_usage", "external_write_or_network"],
              },
              {
                  "case_id": "fresh-008",
                  "repo": "gtsbahamas/text-moderation",
                  "sha": "decb6d85be0afe5bf08d222b519b33cf15e45064",
                  "application_path": "agent.py",
                  "framework_stratum": "pydantic-ai",
                  "signals": ["external_write_or_network"],
              },
              {
                  "case_id": "fresh-009",
                  "repo": "newsbubbles/pharmiq",
                  "sha": "c69949739647a47ec8339b473bdf578c8cf8bfd9",
                  "application_path": "agent.py",
                  "framework_stratum": "pydantic-ai",
                  "signals": ["mcp_usage", "external_write_or_network"],
              },
              {
                  "case_id": "fresh-010",
                  "repo": "ArhamMirza/AI-Budget-CSV-Manager",
                  "sha": "44dc9e7df8c007d813d88810ec6e347086527b66",
                  "application_path": "agent.py",
                  "framework_stratum": "pydantic-ai",
                  "signals": ["filesystem_write", "state_mutation"],
              },
          ]

          candidates = {
              "schema_version": 1,
              "study": "truly-fresh-adk-pydantic-holdout-10",
              "horustrace_results_used_for_selection": False,
              "candidates": [
                  {
                      "repo": c["repo"],
                      "sha": c["sha"],
                      "decision": "include",
                      "previously_studied": False,
                      "previously_studied_check": "checked",
                      "screening": {
                          "source_only": True,
                          "reviewed_at": "2026-10-05",
                          "rationale": "Live GitHub source search found direct framework construction outside the frozen 180-repository corpus.",
                          "license_status": "not_used_for_execution",
                          "application_path": c["application_path"],
                          "tier_b": {"eligible": True, "signals": c["signals"]},
                          "tier_c": {"eligible": False, "signals": []},
                      },
                  }
                  for c in cases
              ],
          }
          cohort = {
              "schema_version": 1,
              "study": "truly-fresh-adk-pydantic-holdout-10",
              "phase": "ground_truth_pending",
              "scanner_freeze_sha": os.environ["SCANNER_SHA"],
              "horustrace_results_used_for_selection": False,
              "cohort_frozen": True,
              "ground_truth_locked": False,
              "cases": [
                  {
                      "case_id": c["case_id"],
                      "repo": c["repo"],
                      "sha": c["sha"],
                      "application_path": c["application_path"],
                      "framework_stratum": c["framework_stratum"],
                      "previously_studied": False,
                      "ground_truth": f"ground-truth/{c['case_id']}.json",
                  }
                  for c in cases
              ],
              "tier_b_case_ids": [c["case_id"] for c in cases],
              "tier_c_case_ids": [],
              "study_slice": {
                  "name": "truly-fresh-adk-pydantic-holdout-10",
                  "selection": "5 Google ADK + 5 native Pydantic AI repositories discovered live outside the entire prior frozen-180 corpus; exact SHAs frozen before HorusScan execution.",
              },
          }
          (root / "candidates.json").write_text(json.dumps(candidates, indent=2) + "\n")
          (root / "cohort.json").write_text(json.dumps(cohort, indent=2) + "\n")
          (out / "selected-cases.json").write_text(json.dumps(cohort["cases"], indent=2) + "\n")
          PY

      - name: Lock independent source reference before scanner execution
        shell: bash
        run: |
          set -euo pipefail
          python scripts/real_world_agent_security_truth.py --root "$STUDY_ROOT" --workers 5
          cp "$STUDY_ROOT/cohort.json" "$OUT_DIR/cohort.locked.json"
          cp "$STUDY_ROOT/ground-truth-summary.json" "$OUT_DIR/ground-truth-summary.json"
          cp -R "$STUDY_ROOT/ground-truth" "$OUT_DIR/ground-truth"

      - name: Install exact P0-P1 scanner after truth lock
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/horustrace-true-fresh-src
          VENV=/tmp/horustrace-true-fresh-venv
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/psandhir/horustrace.git
          git -C "$SRC" fetch --quiet --depth=1 origin "$SCANNER_SHA"
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SCANNER_SHA"
          python -m venv "$VENV"
          "$VENV/bin/pip" install --disable-pip-version-check "$SRC"
          "$VENV/bin/horustrace" --version

      - name: Scan and score truly fresh holdout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/real_world_agent_security_execute.py \
            --root "$STUDY_ROOT" \
            --mode postfix \
            --scanner /tmp/horustrace-true-fresh-venv/bin/horustrace \
            --scanner-sha "$SCANNER_SHA" \
            --workers 5 \
            --output-json "$OUT_DIR/result.json" \
            --output-markdown "$OUT_DIR/result.md"

      - name: Build scorecard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ["OUT_DIR"])
          d = json.loads((out / "result.json").read_text())
          def pct(v):
              return "n/a" if v is None else f"{100*v:.1f}%"
          lines = [
              "# Truly fresh ADK + Pydantic AI holdout 10",
              "",
              f"- Scanner: `{d['scanner_sha']}`",
              f"- Successful: **{d['summary']['successful_cases']}/10**",
              f"- Failed: **{d['summary']['failed_cases']}**",
              f"- Analysis incomplete: **{d['summary']['analysis_incomplete_cases']}**",
              f"- Findings: **{d['summary']['findings']}**",
              f"- Attack paths: **{d['summary']['attack_paths']}**",
              "",
              "| Framework | Agent P/R | Tool P/R | MCP P/R | Authority P/R | Findings | Paths |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for fw in ("google-adk","pydantic-ai"):
              x=d["per_framework"][fw]
              lines.append(
                  f"| {fw} | {pct(x['agent_entities']['precision'])}/{pct(x['agent_entities']['recall'])} | "
                  f"{pct(x['tools']['precision'])}/{pct(x['tools']['recall'])} | "
                  f"{pct(x['mcp_servers']['precision'])}/{pct(x['mcp_servers']['recall'])} | "
                  f"{pct(x['effective_authority']['precision'])}/{pct(x['effective_authority']['recall'])} | "
                  f"{x['findings']} | {x['attack_paths']} |"
              )
          (out / "HOLDOUT_REPORT.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
          cat "$OUT_DIR/HOLDOUT_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truly-fresh-adk-pydantic-holdout-10
          path: research/truly-fresh-adk-pydantic-holdout-10/
          if-no-files-found: error
          retention-days: 30

      - name: Commit results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "horustrace-study-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT_DIR"
          git commit -m "research: record truly fresh ADK/Pydantic holdout 10"
          git push origin HEAD:fix/adk-pydantic-p0-p1-study

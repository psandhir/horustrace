name: Wave B540 V2 Oracle Eligibility Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_wave_b540_v2_oracle_eligibility.py"
      - "tests/test_wave_b540_v2_oracle_eligibility.py"
      - "docs/wave-b540-v2-oracle-eligibility-20261018.md"
      - ".github/workflows/wave-b540-v2-oracle-eligibility.yml"
      - "scripts/audit_wave_b540_active_truth_coverage.py"
      - "research/real-world-agent-security-2026/ground-truth/rw-001.json"

permissions:
  contents: read

jobs:
  oracle-eligibility:
    name: Reject legacy complete flags as V2 agent-accuracy truth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run original and V2 oracle-eligibility hard-negative tests
        run: |
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q \
            tests/test_wave_b540_active_truth_coverage.py \
            tests/test_wave_b540_v2_oracle_eligibility.py
      - name: Produce source-only eligibility decision and assert release NO-GO
        run: |
          python -m scripts.audit_wave_b540_v2_oracle_eligibility \
            --cohort research/real-world-agent-security-2026/cohort.json \
            --truth-root research/real-world-agent-security-2026/ground-truth \
            --output evaluation/active145-v2-oracle-eligibility.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          d = json.loads(Path("evaluation/active145-v2-oracle-eligibility.json").read_text())
          assert d["active_cases"] == 145
          assert d["legacy_agent_complete"] == 56
          assert d["legacy_agent_incomplete"] == 89
          assert d["legacy_completeness_v2_disposition"] == {
              "historical_agent_ontology_incompatible": 1,
              "historical_agent_reference_incomplete": 89,
              "historically_complete_v2_not_yet_adjudicated": 55,
          }
          assert d["independent_v2_negative_label_complete_cases"] == 0
          assert d["independently_certified_v2_agent_precision"] is None
          assert d["independently_certified_v2_agent_recall"] is None
          assert d["known_complete_flag_ontology_conflicts"]["rw-001"][
              "historical_factory_as_agent_positives"
          ] == 6
          assert d["original_locked_active_assertions"].get("absent", 0) == 0
          assert not d["wave_b_go"] and not d["wave_c_go"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(
                  "## Wave B active145 V2 truth eligibility\n"
                  "Historical agent complete 56: 1 known incompatible (rw-001, "
                  "six factory-as-agent claims), 55 not yet V2 adjudicated. "
                  "Historical agent incomplete 89.\n"
                  "**0 independently eligible complete-negative V2 cases. "
                  "This does not mean zero true agents or zero valid positive facts.**\n"
                  "Wave B and Wave C release GO remain false.\n"
              )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wave-b540-active145-v2-truth-eligibility
          path: evaluation/active145-v2-oracle-eligibility.json
          if-no-files-found: error
          retention-days: 30

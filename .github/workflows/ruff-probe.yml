name: Ruff Probe
on:
  push:
    branches: [feature/llm-semantic-escalation]
    paths:
      - ".github/workflows/ruff-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.12,<1"
      - name: Show Ruff fixes
        shell: bash
        run: |
          ruff check --fix --unsafe-fixes src/horustrace/llm_semantics.py || true
          git diff -- src/horustrace/llm_semantics.py

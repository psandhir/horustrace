name: Pydantic Fundamentals 15

on:
  workflow_dispatch:
  push:
    branches:
      - research/pydantic-fundamentals-15
    paths:
      - ".github/workflows/pydantic-fundamentals-15.yml"
      - "research/pydantic-fundamentals-15/run.py"
      - "src/horustrace/adapters/pydantic_ai.py"
      - "src/horustrace/effective_authority.py"
      - "tests/test_pydantic_ai_adapter.py"
  pull_request:
    paths:
      - ".github/workflows/pydantic-fundamentals-15.yml"
      - "research/pydantic-fundamentals-15/run.py"
      - "src/horustrace/adapters/pydantic_ai.py"
      - "src/horustrace/effective_authority.py"
      - "tests/test_pydantic_ai_adapter.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: pydantic-fundamentals-15
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Run Pydantic fundamentals study
        run: |
          python research/pydantic-fundamentals-15/run.py
          cat artifacts/pydantic-fundamentals-15/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload study result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pydantic-fundamentals-15
          path: artifacts/pydantic-fundamentals-15/
          if-no-files-found: error
          retention-days: 30

name: ADK UX Demo Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main, eval/adk-latest-core-and-ux-20261010]
    paths:
      - .github/workflows/adk-ux-demo.yml
      - scripts/run_adk_ux_demo.py
      - src/horustrace/visual_report.py
      - tests/test_adk_ux_demo_acceptance.py

permissions:
  contents: read

jobs:
  render-demo:
    name: Static ADK security workbench end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install HorusTrace
        run: python -m pip install -e '.[dev]'
      - name: Build report from known-vulnerable ADK application source
        run: python scripts/run_adk_ux_demo.py --output-dir adk-ux-report
      - name: Install Chromium browser smoke dependencies
        run: |
          python -m pip install 'playwright>=1.56,<1.60'
          python -m playwright install --with-deps chromium
      - name: Verify tabs, real data, drilldowns and theme in Chromium
        run: python scripts/check_adk_report_browser.py --report adk-ux-report/adk-security-workbench.html
      - name: Validate scanner projection, source evidence and JavaScript syntax
        run: |
          ruff check src tests benchmarks scripts/deployment_authority_study.py
          python -m pytest -q tests/test_visual_report.py tests/test_adk_ux_demo_acceptance.py
      - name: Publish assessment summary
        if: always()
        shell: bash
        run: |
          if [ -f adk-ux-report/adk-acceptance-summary.md ]; then
            {
              echo "## View the ADK security report"
              echo ""
              echo "The findings, severity distribution, authority breakdown, and OWASP results are shown directly below."
              echo "For interactive charts and drilldowns, download **adk-ux-security-workbench** from"
              echo "[this run's Artifacts section](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts),"
              echo "then open **adk-security-workbench.html** in a browser."
              echo ""
              echo "GitHub Actions summaries do not execute standalone HTML/JavaScript reports."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            cat adk-ux-report/adk-acceptance-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload offline HTML, projection, metrics and acceptance summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-ux-security-workbench
          path: adk-ux-report/
          if-no-files-found: error

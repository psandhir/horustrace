name: ADK UX Demo Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/adk-ux-demo.yml
      - scripts/run_adk_ux_demo.py
      - src/horustrace/visual_report.py
      - tests/test_adk_ux_demo_acceptance.py

permissions:
  contents: read

jobs:
  render-demo:
    name: Static ADK security workbench end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Build report from known-vulnerable ADK application source
        run: python scripts/run_adk_ux_demo.py --output-dir adk-ux-report
      - name: Publish assessment summary
        if: always()
        shell: bash
        run: |
          if [ -f adk-ux-report/adk-acceptance-summary.md ]; then
            cat adk-ux-report/adk-acceptance-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload offline HTML, projection, metrics and acceptance summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-ux-security-workbench
          path: adk-ux-report/
          if-no-files-found: error

name: Independent Agent Framework Pilot 12
on:
  push:
    branches:
      - research/independent-20261008-pilot12
    paths:
      - ".github/workflows/independent-agent-framework-pilot12.yml"
      - "research/independent-20261008-pilot12/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scan:
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case_id:
          - ind-google-adk-01
          - ind-google-adk-02
          - ind-pydantic-ai-01
          - ind-pydantic-ai-02
          - ind-openai-agents-01
          - ind-openai-agents-02
          - ind-amazon-01
          - ind-amazon-02
          - ind-anthropic-01
          - ind-anthropic-02
          - ind-microsoft-01
          - ind-microsoft-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Scan pinned independent case
        run: python research/independent-20261008-pilot12/run_case.py --case-id "${{ matrix.case_id }}" --output-dir artifacts
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 30
  aggregate:
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: independent-case-*
          path: downloaded
      - name: Aggregate evidence
        run: |
          python research/independent-20261008-pilot12/aggregate.py --input downloaded --output aggregate
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: independent-pilot12-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

name: Deployment Authority v0.8 Study

on:
  workflow_dispatch:
  push:
    branches:
      - research/v0.8-deployment-authority-execution
    paths:
      - ".github/workflows/deployment-authority-v08-study.yml"
      - "scripts/deployment_authority_study.py"
      - "research/deployment-authority-v08/**"
      - "src/**"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: deployment-authority-v08-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    name: Frozen natural cohort
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out HorusTrace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install frozen-study scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          horustrace --version

      - name: Validate frozen cohort contract
        run: python scripts/deployment_authority_study.py --validate-only

      - name: Execute frozen natural cohort
        id: study
        shell: bash
        run: |
          set +e
          python scripts/deployment_authority_study.py \
            --output-json deployment-authority-v08-results.json \
            --output-markdown deployment-authority-v08-results.md
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Study exit code: $status"
          if [[ -f deployment-authority-v08-results.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("deployment-authority-v08-results.json").read_text())
          print(json.dumps(report["summary"], indent=2))
          print("Expected-output confusion matrix:")
          print(json.dumps(report["expected_output_confusion_matrix"], indent=2))
          print("Independent-security confusion matrix:")
          print(json.dumps(report["security_classification_confusion_matrix"], indent=2))
          PY
          fi
          exit 0

      - name: Upload study report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-authority-v08-results
          path: |
            deployment-authority-v08-results.json
            deployment-authority-v08-results.md
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce harness execution
        if: always()
        shell: bash
        env:
          STUDY_EXIT: ${{ steps.study.outputs.exit_code }}
        run: |
          if [[ -z "$STUDY_EXIT" ]]; then
            echo "Study did not produce an exit code." >&2
            exit 2
          fi
          if [[ "$STUDY_EXIT" == "2" ]]; then
            echo "Study encountered an execution/contract error." >&2
            exit 2
          fi
          echo "Study completed; semantic mismatches are retained in the report for analysis."

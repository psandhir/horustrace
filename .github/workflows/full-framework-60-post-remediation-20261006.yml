name: Full Framework 60 Post Remediation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/full-framework-60-post-remediation-20261006.yml"
      - "src/horustrace/adapters/**"
      - "src/horustrace/analysis.py"
      - "src/horustrace/destination_provenance.py"
      - "src/horustrace/effective_authority.py"
      - "src/horustrace/repository_effect_semantics.py"
      - "src/horustrace/rules/**"
      - "src/horustrace/runtime_ingress.py"
      - "src/horustrace/scanner.py"
      - "src/horustrace/semantic_contract.py"
      - "src/horustrace/skill_llm_semantics.py"
      - "src/horustrace/skills.py"
      - "research/full-framework-60-20261005/**"
      - "research/full-framework-60-post-remediation-20261006/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: full-framework-60-post-remediation-20261006
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify frozen cohort
        run: |
          expected="1ea88dbb611cb7c0a81d5b8717553ef539cbdd49"
          actual="$(git hash-object research/full-framework-60-20261005/cohort.json)"
          test "$actual" = "$expected"
      - id: matrix
        name: Build frozen matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from collections import Counter
          from pathlib import Path

          doc = json.loads(
              Path("research/full-framework-60-20261005/cohort.json").read_text()
          )
          cases = doc["cases"]
          assert len(cases) == 60
          assert len({case["repo"] for case in cases}) == 60
          assert Counter(case["framework"] for case in cases) == {
              "google-adk": 10,
              "pydantic-ai": 10,
              "openai-agents": 10,
              "amazon": 10,
              "anthropic": 10,
              "microsoft": 10,
          }
          print(
              "matrix="
              + json.dumps(
                  [case["case_id"] for case in cases],
                  separators=(",", ":"),
              )
          )
          PY

  scan:
    needs: prepare
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        case_id: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Generate full security evidence bundle
        run: |
          python research/full-framework-60-20261005/run_case.py \
            --case-id "${{ matrix.case_id }}" \
            --output-dir artifacts
      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ff60-post-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate post-remediation cohort
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ff60-post-case-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate original metrics
        run: |
          python research/full-framework-60-20261005/aggregate.py \
            --input downloaded \
            --output aggregate
      - name: Compare with exact baseline
        run: |
          python research/full-framework-60-post-remediation-20261006/compare.py \
            --input downloaded \
            --baseline research/full-framework-60-post-remediation-20261006/baseline.csv \
            --output comparison \
            --scanner-revision "$GITHUB_SHA" \
            --harness-revision "$GITHUB_SHA" \
            --gate-baseline research/full-framework-60-post-remediation-20261006/closure-baseline.json
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-framework-60-post-remediation-summary
          path: |
            aggregate/
            comparison/
          if-no-files-found: error
          retention-days: 30

# connector-permission-probe

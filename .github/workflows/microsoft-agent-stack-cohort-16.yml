name: Microsoft Agent Stack Cohort 16

on:
  workflow_dispatch:
  push:
    branches:
      - research/microsoft-agent-stack-cohort-16
    paths:
      - ".github/workflows/microsoft-agent-stack-cohort-16.yml"
      - "research/microsoft-agent-stack-cohort-16/**"
      - "src/horustrace/adapters/microsoft_agent_framework.py"
      - "src/horustrace/adapters/microsoft_agent_framework_dotnet.py"
      - "src/horustrace/adapters/microsoft_foundry.py"
      - "src/horustrace/scanner.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: microsoft-agent-stack-cohort-16
  cancel-in-progress: true

jobs:
  scan:
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case_id:
          - ms-dotnet-001
          - ms-dotnet-002
          - ms-dotnet-003
          - ms-dotnet-004
          - ms-dotnet-005
          - ms-dotnet-006
          - ms-python-001
          - ms-python-002
          - ms-python-003
          - ms-python-004
          - ms-python-005
          - ms-python-006
          - ms-discovery-001
          - ms-discovery-002
          - ms-discovery-003
          - ms-discovery-004

    steps:
      - name: Checkout HorusTrace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HorusTrace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Microsoft cohort case
        run: |
          python research/microsoft-agent-stack-cohort-16/run_case.py \
            --case-id "${{ matrix.case_id }}" \
            --output-dir artifacts

      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-stack-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate Microsoft cohort
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HorusTrace
        uses: actions/checkout@v4

      - name: Download case bundles
        uses: actions/download-artifact@v4
        with:
          pattern: microsoft-stack-case-*
          path: downloaded

      - name: Aggregate
        run: |
          python research/microsoft-agent-stack-cohort-16/aggregate.py \
            --input downloaded \
            --output aggregate
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-agent-stack-cohort-16-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

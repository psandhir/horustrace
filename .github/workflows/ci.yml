name: CI
on:
  push:
    branches: [main, v0.4-dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests benchmarks scripts/deployment_authority_study.py
      - name: Run tests
        if: matrix.python-version == '3.11'
        run: pytest -q
      - name: Run tests with branch coverage
        if: matrix.python-version == '3.12'
        run: >-
          pytest -q
          --cov=horustrace
          --cov-branch
          --cov-fail-under=82
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
      - name: Publish coverage summary
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          with open("coverage.json", encoding="utf-8") as handle:
              totals = json.load(handle)["totals"]
          lines = [
              "## Branch coverage guardrail",
              "",
              "- Required floor: 82%",
              f"- Lines: {totals['percent_covered_display']}%",
              f"- Statements: {totals['covered_lines']}/{totals['num_statements']}",
              f"- Branches: {totals['covered_branches']}/{totals['num_branches']}",
              f"- Missing branches: {totals['missing_branches']}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-${{ github.sha }}
          path: |
            coverage.xml
            coverage.json
      - run: python scripts/deployment_authority_study.py --validate-only
      - run: horustrace benchmark benchmarks/cases.yaml

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: horustrace scan examples/secure-agent --strict --fail-on high
      - run: horustrace scan examples/google-adk-secure --strict --fail-on high
      - run: >-
          horustrace reconcile examples/deployment-reconciliation
          --deployment-evidence examples/deployment-reconciliation/deployment-evidence.yaml
          --format json
          --fail-on-excess-authority
          --fail-on-deployed-policy-violation

  provenance-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Regenerate vulnerable ADK report
        run: |
          horustrace report examples/google-adk-vulnerable --output provenance-demo.html
          horustrace scan examples/google-adk-vulnerable --format json --output provenance-demo.json --fail-on none
      - name: Compare finding provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          with open("provenance-demo.json", encoding="utf-8") as handle:
              report = json.load(handle)
          target = {"AGT010", "CAP002", "DATA003", "PATH003"}
          findings = [f for f in report["findings"] if f["rule_id"] in target]
          lines = [
              "## Finding-specific provenance rerun",
              "",
              "| Finding | Agent | Supporting facts |",
              "|---|---|---:|",
          ]
          for finding in findings:
              lines.append(
                  f"| {finding['rule_id']} | {finding.get('agent') or 'n/a'} | "
                  f"{len(finding.get('provenance') or [])} |"
              )
          lines.append("")
          lines.append(
              "Original source facts remain available in the "
              "agent-level Evidence tab; scanner findings are unchanged."
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          if len(findings) < 2:
              raise SystemExit("Demo must expose multiple provenance-checked findings")
          grouped = {}
          for finding in findings:
              grouped.setdefault(finding.get("agent"), []).append(finding)
          for group in grouped.values():
              if len(group) > 1:
                  fact_signatures = [
                      frozenset(
                          (item.get("subject"), item.get("fact"), item.get("origin"))
                          for item in finding.get("provenance") or []
                      )
                      for finding in group
                  ]
                  if len(set(fact_signatures)) == 1 and fact_signatures[0]:
                      raise SystemExit("Multiple distinct findings share identical agent-wide provenance")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-demo-report
          path: |
            provenance-demo.html
            provenance-demo.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: >-
          python -m venv wheel-venv &&
          wheel-venv/bin/pip install dist/*.whl &&
          wheel-venv/bin/horustrace --help &&
          wheel-venv/bin/horustrace --version | grep -q 'horustrace 0.9.0' &&
          wheel-venv/bin/horustrace rules --format json &&
          wheel-venv/bin/horustrace scan examples/secure-agent --strict --fail-on high &&
          wheel-venv/bin/horustrace reconcile examples/deployment-reconciliation
          --deployment-evidence examples/deployment-reconciliation/deployment-evidence.yaml
          --format json --fail-on-excess-authority --fail-on-deployed-policy-violation &&
          wheel-venv/bin/python -c "import horustrace"

  action-reconcile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run HorusTrace deployed authority reconciliation
        uses: ./
        with:
          mode: reconcile
          path: examples/deployment-reconciliation
          deployment-evidence: examples/deployment-reconciliation/deployment-evidence.yaml
          format: json
          fail-on-excess-authority: "true"
          fail-on-deployed-policy-violation: "true"

  action-pr-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run HorusTrace PR security delta
        id: horustrace
        uses: ./
        with:
          mode: diff
          fail-on: high
          strict: "false"
      - name: Verify immutable diff outputs
        shell: bash
        env:
          BASE_SHA: ${{ steps.horustrace.outputs.base-sha }}
          HEAD_SHA: ${{ steps.horustrace.outputs.head-sha }}
          REPORT_PATH: ${{ steps.horustrace.outputs.report-path }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -f "$REPORT_PATH" ]]
          grep -q '^# HorusTrace Security Delta' "$REPORT_PATH"


name: CI
on:
  push:
    branches: [main, v0.4-dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests benchmarks scripts/deployment_authority_study.py
      - run: pytest -q
      - run: python scripts/deployment_authority_study.py --validate-only
      - run: horustrace benchmark benchmarks/cases.yaml

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: horustrace scan examples/secure-agent --strict --fail-on high
      - run: horustrace scan examples/google-adk-secure --strict --fail-on high
      - run: >-
          horustrace reconcile examples/deployment-reconciliation
          --deployment-evidence examples/deployment-reconciliation/deployment-evidence.yaml
          --format json
          --fail-on-excess-authority
          --fail-on-deployed-policy-violation

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: >-
          python -m venv wheel-venv &&
          wheel-venv/bin/pip install dist/*.whl &&
          wheel-venv/bin/horustrace --help &&
          wheel-venv/bin/horustrace --version | grep -q 'horustrace 0.9.0' &&
          wheel-venv/bin/horustrace rules --format json &&
          wheel-venv/bin/horustrace scan examples/secure-agent --strict --fail-on high &&
          wheel-venv/bin/horustrace reconcile examples/deployment-reconciliation
          --deployment-evidence examples/deployment-reconciliation/deployment-evidence.yaml
          --format json --fail-on-excess-authority --fail-on-deployed-policy-violation &&
          wheel-venv/bin/python -c "import horustrace"

  action-reconcile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run HorusTrace deployed authority reconciliation
        uses: ./
        with:
          mode: reconcile
          path: examples/deployment-reconciliation
          deployment-evidence: examples/deployment-reconciliation/deployment-evidence.yaml
          format: json
          fail-on-excess-authority: "true"
          fail-on-deployed-policy-violation: "true"

  action-pr-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run HorusTrace PR security delta
        id: horustrace
        uses: ./
        with:
          mode: diff
          fail-on: high
          strict: "false"
      - name: Verify immutable diff outputs
        shell: bash
        env:
          BASE_SHA: ${{ steps.horustrace.outputs.base-sha }}
          HEAD_SHA: ${{ steps.horustrace.outputs.head-sha }}
          REPORT_PATH: ${{ steps.horustrace.outputs.report-path }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -f "$REPORT_PATH" ]]
          grep -q '^# HorusTrace Security Delta' "$REPORT_PATH"


name: Frozen 90 v0.7 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/v0.7-frozen-90
    paths:
      - "src/**"
      - "scripts/frozen_corpus_rescan.py"
      - "benchmarks/public-corpus/cohort-*-v1.json"
      - ".github/workflows/frozen-90-v07.yml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: frozen-90-v07-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Frozen cohort ${{ matrix.cohort }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: a
            manifest: benchmarks/public-corpus/cohort-a-v1.json
          - cohort: b
            manifest: benchmarks/public-corpus/cohort-b-v1.json
          - cohort: c
            manifest: benchmarks/public-corpus/cohort-c-v1.json

    steps:
      - name: Check out HorusTrace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install current HorusTrace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          horustrace --version

      - name: Scan frozen cohort
        env:
          HORUSTRACE_SCANNER_REF: ${{ github.sha }}
        run: |
          python scripts/frozen_corpus_rescan.py \
            --cohort "${{ matrix.cohort }}" \
            --manifest "${{ matrix.manifest }}" \
            --output-prefix "frozen-v07-${{ matrix.cohort }}"

      - name: Upload cohort report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-v07-${{ matrix.cohort }}
          path: |
            frozen-v07-${{ matrix.cohort }}.json
            frozen-v07-${{ matrix.cohort }}.md
          if-no-files-found: warn

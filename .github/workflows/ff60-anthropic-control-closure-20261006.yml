name: FF60 Anthropic Control Closure

on:
  push:
    branches:
      - study/ff60-anthropic-control-closure-20261006
    paths:
      - ".github/workflows/ff60-anthropic-control-closure-20261006.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Generate frozen-case evidence
        run: |
          python research/full-framework-60-20261005/run_case.py \
            --case-id ff60-anthropic-06 \
            --output-dir artifacts
      - name: Assert control propagation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("artifacts/ff60-anthropic-06/result.json").read_text()
          )

          controlled_agents = {
              agent["name"]
              for agent in result["agent_inventory"]
              if agent.get("metadata", {}).get("tool_control_enforcing") is True
          }
          assert controlled_agents, "no controlled Anthropic agents detected"

          controlled_relationships = [
              rel
              for rel in result["authority_relationships"]
              if rel.get("agent") in controlled_agents
              and rel.get("target", {}).get("kind") == "tool"
          ]
          assert controlled_relationships, "no controlled tool relationships detected"
          assert all(
              rel.get("dimensions", {}).get("approval") == "resolved"
              and rel.get("approval", {}).get("inherited_control") is True
              and rel.get("approval", {}).get("mechanism")
              for rel in controlled_relationships
          ), "controlled tool authority did not resolve inherited control"

          false_control_gaps = [
              finding
              for finding in result["findings"]
              if finding.get("rule_id") == "AGT040"
              and finding.get("agent") in controlled_agents
          ]
          assert not false_control_gaps, false_control_gaps

          print(json.dumps({
              "status": "PASS",
              "controlled_agents": sorted(controlled_agents),
              "controlled_relationships": len(controlled_relationships),
              "agt040_on_controlled_agents": 0,
              "counts": result["counts"],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ff60-anthropic-control-closure
          path: artifacts/ff60-anthropic-06/
          retention-days: 30

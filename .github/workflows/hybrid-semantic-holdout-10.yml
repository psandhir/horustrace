name: Hybrid Semantic Holdout 10

on:
  push:
    branches:
      - feature/llm-semantic-escalation
    paths:
      - ".github/workflows/hybrid-semantic-holdout-10.yml"

permissions:
  contents: write

concurrency:
  group: hybrid-semantic-holdout-10
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SEMANTIC_MODEL: gpt-5.6-sol
    steps:
      - name: Checkout HorusTrace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify semantic model credential
        shell: bash
        run: |
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY repository secret is required."
            exit 1
          fi

      - name: Install candidate
        run: python -m pip install -e .

      - name: Run deterministic vs hybrid holdout
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          from horustrace.config import load_config
          from horustrace.llm_semantics import LLMSemanticConfig
          from horustrace.scanner import scan

          CASES = [
              ("ho-001","arjunprabhulal/adk-mcp-gemma3","e487feaffeb9b53d49733af985a88a1924781e5f","google-adk"),
              ("ho-002","kweinmeister/agentic-trading","9e4046b1144e44785ccaa7ce35a4491f86d79e80","google-adk"),
              ("ho-003","mongodb-developer/MongoDB-ADK-Agents","aafaefdb16230ed1c24ca6ae5605360befafaab2","google-adk"),
              ("ho-004","langchain-ai/google-adk-realtime-deepagents-example","b94966176abdddea652589d9cf8a59c00be26c8a","google-adk"),
              ("ho-005","box-community/google-adk-box-agent","c35dc3d306a7baa3629fd7c72c37e1791cda1e9e","google-adk"),
              ("ho-006","coleam00/MongoDB-RAG-Agent","b048eeab220e43b2b8f8c97508e4d6d2c134a468","pydantic-ai"),
              ("ho-007","coleam00/human-in-the-loop-rag-agent","b5f6158cacc0c52a1585429de3751a31f551d333","pydantic-ai"),
              ("ho-008","slack-samples/bolt-python-starter-agent","01fc89f9059348af2d172f8ea1dc62bffd008611","pydantic-ai"),
              ("ho-009","vstorm-co/pydantic-ai-backend","8ac7b678b633aa51c054a884ce27d31b130b8110","pydantic-ai"),
              ("ho-010","vstorm-co/subagents-pydantic-ai","bb8c400732ad515a1e2bfc554ee2dcf7500b2ef9","pydantic-ai"),
          ]

          def clone_case(root, case):
              case_id, repo, sha, _ = case
              target = root / case_id
              target.mkdir()
              commands = [
                  ["git","init","-q",str(target)],
                  ["git","-C",str(target),"remote","add","origin",f"https://github.com/{repo}.git"],
                  ["git","-C",str(target),"fetch","--quiet","--depth=1","--filter=blob:none","origin",sha],
                  ["git","-C",str(target),"checkout","--quiet","--detach","FETCH_HEAD"],
              ]
              for command in commands:
                  cp = subprocess.run(
                      command,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      timeout=240,
                  )
                  if cp.returncode:
                      raise RuntimeError((cp.stderr or cp.stdout)[-4000:])
              return target

          def serialize(graph, findings):
              return {
                  "coverage": graph.coverage.as_dict(),
                  "agents": [
                      {
                          "name": agent.name,
                          "metadata": agent.metadata,
                          "inputs": [
                              {
                                  "name": item.name,
                                  "trust": item.trust,
                                  "kind": item.kind,
                                  "metadata": item.metadata,
                              }
                              for item in agent.inputs
                          ],
                          "mcp_servers": [
                              {
                                  "name": server.name,
                                  "transport": server.transport,
                                  "url": server.url,
                                  "command": server.command,
                                  "approval": server.approval,
                                  "allowed_tools": server.allowed_tools,
                                  "metadata": server.metadata,
                              }
                              for server in agent.mcp_servers
                          ],
                          "tools": [
                              {
                                  "name": tool.name,
                                  "kind": tool.kind,
                                  "capabilities": sorted(tool.capabilities),
                                  "approval": tool.approval,
                                  "guardrails": tool.guardrails,
                                  "resources": [
                                      {
                                          "kind": resource.kind,
                                          "selector": resource.selector,
                                          "access": sorted(resource.access),
                                          "classification": resource.classification,
                                          "metadata": resource.metadata,
                                      }
                                      for resource in tool.resources
                                  ],
                                  "destinations": [
                                      {
                                          "target": destination.target,
                                          "restricted": destination.restricted,
                                          "metadata": destination.metadata,
                                      }
                                      for destination in tool.destinations
                                  ],
                                  "metadata": tool.metadata,
                              }
                              for tool in agent.tools
                          ],
                      }
                      for agent in graph.agents
                  ],
                  "unbound_mcp_servers": [
                      {
                          "name": server.name,
                          "transport": server.transport,
                          "url": server.url,
                          "command": server.command,
                          "metadata": server.metadata,
                      }
                      for server in graph.unbound_mcp_servers
                  ],
                  "findings": [finding.as_dict() for finding in findings],
                  "attack_paths": [
                      {
                          "path_id": path.path_id,
                          "title": path.title,
                          "agent": path.agent,
                          "nodes": path.nodes,
                          "severity": path.severity.label(),
                          "metadata": path.metadata,
                      }
                      for path in graph.attack_paths
                  ],
                  "flow_paths": [flow.as_dict() for flow in graph.flow_paths],
                  "diagnostics": [
                      diagnostic.as_dict()
                      for diagnostic in graph.coverage.diagnostics
                  ],
              }

          def counts(result):
              agents = result.get("agents") or []
              return {
                  "agents": len(agents),
                  "tools": sum(len(agent.get("tools") or []) for agent in agents),
                  "mcp": sum(len(agent.get("mcp_servers") or []) for agent in agents),
                  "findings": len(result.get("findings") or []),
                  "attack_paths": len(result.get("attack_paths") or []),
              }

          results = []
          runner_temp = Path(os.environ.get("RUNNER_TEMP", "/tmp"))
          with tempfile.TemporaryDirectory(prefix="horustrace-hybrid-holdout-") as temp:
              root = Path(temp)
              for index, case in enumerate(CASES, 1):
                  case_id, repo_name, sha, framework = case
                  started = time.monotonic()
                  print(f"[{index:02d}/10] {case_id} {repo_name}", flush=True)
                  row = {
                      "case_id": case_id,
                      "repo": repo_name,
                      "sha": sha,
                      "framework": framework,
                  }
                  try:
                      target = clone_case(root, case)
                      scan_config = load_config(target)
                      baseline_graph, baseline_findings = scan(
                          target,
                          config=scan_config,
                      )
                      hybrid_graph, hybrid_findings = scan(
                          target,
                          config=scan_config,
                          llm_semantic_config=LLMSemanticConfig(
                              provider="openai",
                              model=os.environ["SEMANTIC_MODEL"],
                              max_candidates=4,
                              max_slice_chars=8000,
                              max_total_chars=24000,
                              min_confidence=0.75,
                              max_retries=3,
                              cache_path=runner_temp / f"{case_id}-semantic-cache.json",
                              fail_open=True,
                          ),
                      )
                      baseline = serialize(baseline_graph, baseline_findings)
                      hybrid = serialize(hybrid_graph, hybrid_findings)
                      row.update(
                          scan="ok",
                          baseline=baseline,
                          hybrid=hybrid,
                          baseline_counts=counts(baseline),
                          hybrid_counts=counts(hybrid),
                          semantic_llm=hybrid_graph.coverage.resolution.get(
                              "semantic_llm", {}
                          ),
                      )
                  except Exception as exc:
                      row.update(
                          scan="error",
                          error=f"{type(exc).__name__}: {exc}",
                      )
                  row["elapsed_seconds"] = round(time.monotonic() - started, 2)
                  results.append(row)
                  shutil.rmtree(root / case_id, ignore_errors=True)

          semantic = [row.get("semantic_llm") or {} for row in results]
          summary = {
              "requested": len(CASES),
              "scanned": sum(row.get("scan") == "ok" for row in results),
              "errors": sum(row.get("scan") != "ok" for row in results),
              "eligible_candidates": sum(int(s.get("eligible_candidates", 0)) for s in semantic),
              "selected_candidates": sum(int(s.get("selected_candidates", 0)) for s in semantic),
              "fresh_llm_calls": sum(int(s.get("escalated", 0)) for s in semantic),
              "cache_hits": sum(int(s.get("cache_hits", 0)) for s in semantic),
              "applied": sum(int(s.get("applied", 0)) for s in semantic),
              "low_confidence": sum(int(s.get("low_confidence", 0)) for s in semantic),
              "semantic_errors": sum(int(s.get("errors", 0)) for s in semantic),
              "input_chars": sum(int(s.get("input_chars", 0)) for s in semantic),
              "estimated_input_tokens_at_4_chars": round(
                  sum(int(s.get("input_chars", 0)) for s in semantic) / 4
              ),
              "baseline_findings": sum(
                  int((row.get("baseline_counts") or {}).get("findings", 0))
                  for row in results
              ),
              "hybrid_findings": sum(
                  int((row.get("hybrid_counts") or {}).get("findings", 0))
                  for row in results
              ),
              "baseline_attack_paths": sum(
                  int((row.get("baseline_counts") or {}).get("attack_paths", 0))
                  for row in results
              ),
              "hybrid_attack_paths": sum(
                  int((row.get("hybrid_counts") or {}).get("attack_paths", 0))
                  for row in results
              ),
          }
          report = {
              "schema_version": 1,
              "study": "gpt-horustrace-differential-2026",
              "batch_id": "hybrid-semantic-holdout-10",
              "ground_truth_batch": "framework-holdout-adk-pydantic-10",
              "ground_truth_lock": {
                  "cohort": "05104912966ebfd08e500142aaac75e8b9f14626",
                  "blind_review": "ee5a1b53e187e79a7c26147a10bd322e76d38b31",
              },
              "scanner_commit": os.environ.get("GITHUB_SHA"),
              "semantic_model": os.environ["SEMANTIC_MODEL"],
              "budgets": {
                  "max_candidates_per_repo": 4,
                  "max_slice_chars": 8000,
                  "max_total_chars_per_repo": 24000,
                  "min_confidence": 0.75,
              },
              "summary": summary,
              "results": results,
          }

          base = Path("research/gpt-horustrace-differential-2026")
          base.mkdir(parents=True, exist_ok=True)
          json_path = base / "hybrid-semantic-holdout-10-results.json"
          json_path.write_text(
              json.dumps(report, indent=2, default=str) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Hybrid semantic holdout — deterministic vs targeted LLM",
              "",
              f"- Scanner commit: {report['scanner_commit']}",
              f"- Model: {report['semantic_model']}",
              "- Ground truth: locked #279 blind review",
              f"- Scanned: {summary['scanned']}/{summary['requested']}",
              f"- Fresh LLM calls: {summary['fresh_llm_calls']}",
              f"- Applied semantic resolutions: {summary['applied']}",
              f"- Low-confidence rejections: {summary['low_confidence']}",
              f"- Semantic resolver errors: {summary['semantic_errors']}",
              f"- Source chars sent: {summary['input_chars']}",
              f"- Approx input tokens (@4 chars/token): {summary['estimated_input_tokens_at_4_chars']}",
              f"- Findings: {summary['baseline_findings']} deterministic -> {summary['hybrid_findings']} hybrid",
              f"- Attack paths: {summary['baseline_attack_paths']} deterministic -> {summary['hybrid_attack_paths']} hybrid",
              "",
              "| Case | Baseline A/T/M/F/P | Hybrid A/T/M/F/P | Eligible | Calls | Applied | Input chars |",
              "|---|---|---|---:|---:|---:|---:|",
          ]
          for row in results:
              if row.get("scan") != "ok":
                  lines.append(
                      f"| {row['case_id']} | error | error | - | - | - | - |"
                  )
                  continue
              b = row["baseline_counts"]
              h = row["hybrid_counts"]
              sem = row["semantic_llm"]
              btxt = f"{b['agents']}/{b['tools']}/{b['mcp']}/{b['findings']}/{b['attack_paths']}"
              htxt = f"{h['agents']}/{h['tools']}/{h['mcp']}/{h['findings']}/{h['attack_paths']}"
              lines.append(
                  f"| {row['case_id']} | {btxt} | {htxt} | "
                  f"{sem.get('eligible_candidates', 0)} | "
                  f"{sem.get('escalated', 0)} | "
                  f"{sem.get('applied', 0)} | "
                  f"{sem.get('input_chars', 0)} |"
              )
          md_path = base / "HYBRID_SEMANTIC_HOLDOUT_10_RESULTS.md"
          md_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("\n".join(lines), flush=True)
          PY

      - name: Commit comparison results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/gpt-horustrace-differential-2026/hybrid-semantic-holdout-10-results.json             research/gpt-horustrace-differential-2026/HYBRID_SEMANTIC_HOLDOUT_10_RESULTS.md
          if git diff --cached --quiet; then
            echo "No holdout result changes."
          else
            git commit -m "research: record hybrid semantic holdout results"
            git push
          fi

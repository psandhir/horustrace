name: Agent-Centric Unseen 12 v4

on:
  workflow_dispatch:
  push:
    branches:
      - research/agent-centric-unseen-12-v4
    paths:
      - ".github/workflows/agent-centric-unseen-12-v4.yml"
      - "research/agent-centric-unseen-12-v4/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-centric-unseen-12-v4
  cancel-in-progress: true

jobs:
  scan:
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case_id:
          - unseen4-adk-001
          - unseen4-adk-002
          - unseen4-adk-003
          - unseen4-adk-004
          - unseen4-pyd-001
          - unseen4-pyd-002
          - unseen4-pyd-003
          - unseen4-pyd-004
          - unseen4-oai-001
          - unseen4-oai-002
          - unseen4-oai-003
          - unseen4-oai-004

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Generate frozen scan bundle
        run: |
          python research/agent-centric-unseen-12-v4/run_case.py \
            --case-id "${{ matrix.case_id }}" \
            --output-dir artifacts
      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-centric-unseen4-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate unseen cohort
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-centric-unseen4-case-*
          path: downloaded
      - name: Aggregate
        run: |
          python research/agent-centric-unseen-12-v4/aggregate.py --input downloaded --output aggregate
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-centric-unseen-12-v4-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

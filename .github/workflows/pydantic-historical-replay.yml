name: Historical PydanticAI regression replay
on:
  pull_request:
    paths:
      - '.github/workflows/pydantic-historical-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: scanner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover pinned historical Pydantic cases (fail closed)
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('scanner')
          candidates=[]
          for p in root.rglob('*.json'):
              if '.git' in p.parts or 'node_modules' in p.parts: continue
              try: obj=json.loads(p.read_text())
              except (ValueError,UnicodeError,OSError): continue
              def walk(x):
                  if isinstance(x,dict):
                      if isinstance(x.get('repo'),str) and isinstance(x.get('sha'),str) and len(x['sha'])==40:
                          if 'pydantic' in str(x.get('category','')).lower() or 'pydantic' in str(x.get('framework','')).lower():
                              yield x
                      for v in x.values(): yield from walk(v)
                  elif isinstance(x,list):
                      for v in x: yield from walk(v)
              cases=list(walk(obj))
              if len({(c['repo'],c['sha']) for c in cases})==34:
                  candidates.append((str(p),cases))
          if len(candidates)!=1:
              print('FAIL CLOSED: expected exactly one original frozen-180 manifest with 34 pinned Pydantic cases; found',[(p,len(c)) for p,c in candidates])
              sys.exit(1)
          source,cases=candidates[0]
          out=[{'repo':c['repo'],'sha':c['sha']} for c in cases]
          pathlib.Path('pydantic-cases.json').write_text(json.dumps({'source':source,'cases':out},indent=2))
          print('Selected original manifest',source,'with',len(out),'pinned cases')
          PY
      - name: Upload frozen case selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-pydantic-case-selection
          path: pydantic-cases.json
          if-no-files-found: ignore
      - name: Install current scanner
        run: python -m pip install ./scanner
      - name: Run pinned cases and capture JSON
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,tempfile
          cases=json.loads(pathlib.Path('pydantic-cases.json').read_text())['cases']
          output=pathlib.Path('results');output.mkdir()
          rows=[]
          for i,case in enumerate(cases):
              with tempfile.TemporaryDirectory() as td:
                  repo,sha=case['repo'],case['sha']
                  commands=[['git','init','-q',td],['git','-C',td,'remote','add','origin','https://github.com/'+repo+'.git'],['git','-C',td,'fetch','-q','--depth=1','origin',sha],['git','-C',td,'checkout','-q','--detach','FETCH_HEAD']]
                  try:
                      for cmd in commands: subprocess.run(cmd,check=True,timeout=180)
                      path=output/f'{i:02d}.json'
                      subprocess.run(['horustrace','scan',td,'--format','json','--output',str(path),'--fail-on','none'],check=True,timeout=300)
                      rows.append({'repo':repo,'sha':sha,'result':str(path),'status':'success'})
                  except Exception as e: rows.append({'repo':repo,'sha':sha,'status':'failed','error':str(e)})
          (output/'index.json').write_text(json.dumps(rows,indent=2))
          if any(r['status']!='success' for r in rows): raise SystemExit('Some scans failed; inspect index')
          PY
      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-pydantic-current-main-replay
          path: results/
          if-no-files-found: ignore
          retention-days: 90

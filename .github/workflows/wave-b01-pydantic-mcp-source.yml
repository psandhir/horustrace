name: Wave B01 Pydantic MCP pinned-source proof
on:
  pull_request:
    paths:
      - "src/horustrace/source_native_mcp.py"
      - "src/horustrace/semantic_discovery.py"
      - "src/horustrace/semantic_shadow.py"
      - "scripts/verify_wave_b01_pharmiq_source.py"
      - "research/accuracy-wave-b-pilot-20261014/pharmiq-source-tool-proof.json"
      - ".github/workflows/wave-b01-pydantic-mcp-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install scanner without executing target repository dependencies
        run: python -m pip install -e .
      - name: Fetch exact WAB-01 source commit (do not import or execute it)
        shell: bash
        run: |
          mkdir -p /tmp/horusscan-wab01
          git -C /tmp/horusscan-wab01 init
          git -C /tmp/horusscan-wab01 remote add origin https://github.com/newsbubbles/pharmiq.git
          git -C /tmp/horusscan-wab01 fetch --depth=1 origin c69949739647a47ec8339b473bdf578c8cf8bfd9
          git -C /tmp/horusscan-wab01 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/horusscan-wab01 rev-parse HEAD)" = c69949739647a47ec8339b473bdf578c8cf8bfd9
      - name: Assert pinned source-verified client, provider and 22 tool-exposure edges
        run: >-
          python -m scripts.verify_wave_b01_pharmiq_source
          --source /tmp/horusscan-wab01
          --ledger research/accuracy-wave-b-pilot-20261014/pharmiq-source-tool-proof.json

name: Amazon SDK Depth Parity 15

on:
  workflow_dispatch:
  push:
    branches:
      - research/amazon-sdk-depth-parity-15
    paths:
      - ".github/workflows/amazon-sdk-depth-parity-15.yml"
      - "research/amazon-sdk-depth-parity-15/**"
      - "src/horustrace/adapters/amazon_agentic.py"
      - "src/horustrace/adapters/amazon_strands_typescript.py"
      - "src/horustrace/amazon_repository_authority.py"
      - "src/horustrace/effective_authority.py"
      - "src/horustrace/scanner.py"
      - "tests/test_amazon_agentic.py"
      - "tests/test_amazon_strands_typescript.py"
  pull_request:
    paths:
      - ".github/workflows/amazon-sdk-depth-parity-15.yml"
      - "research/amazon-sdk-depth-parity-15/**"
      - "src/horustrace/adapters/amazon_agentic.py"
      - "src/horustrace/adapters/amazon_strands_typescript.py"
      - "src/horustrace/amazon_repository_authority.py"
      - "src/horustrace/effective_authority.py"
      - "src/horustrace/scanner.py"
      - "tests/test_amazon_agentic.py"
      - "tests/test_amazon_strands_typescript.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: amazon-sdk-depth-parity-15
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Run Amazon SDK depth-parity study
        run: |
          python research/amazon-sdk-depth-parity-15/run.py
          cat artifacts/amazon-sdk-depth-parity-15/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload study result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-sdk-depth-parity-15
          path: artifacts/amazon-sdk-depth-parity-15/
          if-no-files-found: error
          retention-days: 30

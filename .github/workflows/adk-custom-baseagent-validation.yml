name: ADK Custom BaseAgent Validation

on:
  push:
    branches:
      - fix/adk-custom-baseagent-composition
    paths:
      - ".github/workflows/adk-custom-baseagent-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install candidate
        run: pip install -e .
      - name: Fetch frozen holdout repositories
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --no-checkout https://github.com/GothiProCoder/Multi-Agent-System-Google-ADK.git /tmp/fresh005
          git -C /tmp/fresh005 fetch -q --depth=1 origin 713cd35bf3759becc84ef6bf8958953df3d3f272
          git -C /tmp/fresh005 checkout -q --detach FETCH_HEAD

          git clone -q --no-checkout https://github.com/K-Dense-AI/agentic-data-scientist.git /tmp/kdense
          git -C /tmp/kdense fetch -q --depth=1 origin 702dee9dfb9e5165ce51b52ad7b7885948df7cd1
          git -C /tmp/kdense checkout -q --detach FETCH_HEAD
      - name: Scan frozen repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/adk-custom-baseagent-validation
          horustrace scan /tmp/fresh005 --format json > /tmp/fresh005.json || true
          horustrace scan /tmp/kdense --format json > /tmp/kdense.json || true
          python - <<'PY'
          import json
          from pathlib import Path

          def topology(path):
              data=json.loads(Path(path).read_text())
              adg=data.get("adg") or {}
              nodes=adg.get("nodes") or []
              edges=adg.get("edges") or []
              names={n.get("node_id"): n.get("name") for n in nodes if n.get("kind")=="agent"}
              delegations=sorted({
                  (names[e.get("source")], names[e.get("target")])
                  for e in edges
                  if e.get("kind")=="DELEGATES_TO"
                  and e.get("source") in names
                  and e.get("target") in names
              })
              return {
                  "agents": sorted(set(names.values())),
                  "delegations": [list(x) for x in delegations],
                  "analysis_incomplete": (data.get("coverage") or {}).get("incomplete"),
              }

          fresh=topology("/tmp/fresh005.json")
          kdense=topology("/tmp/kdense.json")
          expected_fresh=[
              ["DynamicOrchestratorAgent","launches_agent"],
              ["DynamicOrchestratorAgent","news_agent"],
              ["DynamicOrchestratorAgent","summarizer_agent"],
              ["DynamicOrchestratorAgent","weather_agent"],
              ["RootPlannerOrchestrator","DynamicOrchestratorAgent"],
              ["RootPlannerOrchestrator","MasterPlannerAgent"],
          ]
          missing_fresh=[edge for edge in expected_fresh if edge not in fresh["delegations"]]

          expected_kdense_root=["agentic_data_scientist_workflow","stage_orchestrator"]
          missing_kdense_root=expected_kdense_root not in kdense["delegations"]
          expected_stage_targets={"implementation_loop","success_criteria_checker","stage_reflector"}
          observed_stage={
              target for source,target in kdense["delegations"]
              if source=="stage_orchestrator"
          }

          result={
              "fresh005": fresh,
              "fresh005_missing_expected": missing_fresh,
              "kdense": kdense,
              "kdense_missing_root_stage": missing_kdense_root,
              "kdense_stage_expected_targets": sorted(expected_stage_targets),
              "kdense_stage_observed_targets": sorted(observed_stage),
              "kdense_stage_missing_targets": sorted(expected_stage_targets-observed_stage),
          }
          out=Path("research/adk-custom-baseagent-validation/result.json")
          out.write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          if missing_fresh or missing_kdense_root or (expected_stage_targets-observed_stage):
              raise SystemExit(1)
          PY
      - name: Commit validation result
        if: success()
        shell: bash
        run: |
          git config user.name horustrace-study-bot
          git config user.email actions@users.noreply.github.com
          git add research/adk-custom-baseagent-validation/result.json
          git commit -m "research: validate custom ADK BaseAgent topology"
          git push origin HEAD:fix/adk-custom-baseagent-composition

name: Study Evaluation Contract

on:
  pull_request:
    paths:
      - "scripts/study_evaluation_gate.py"
      - "scripts/check_study_registry.py"
      - "tests/test_study_registry.py"
      - "research/studies/**"
      - ".github/workflows/reusable-study-quality-gate.yml"
      - "tests/test_study_evaluation_gate.py"
      - "research/STUDY_EVALUATION_CONTRACT.md"
      - ".github/workflows/study-evaluation-contract.yml"
  push:
    branches:
      - research/lock-study-evaluation-gates-20261008
    paths:
      - "scripts/study_evaluation_gate.py"
      - "scripts/check_study_registry.py"
      - "tests/test_study_registry.py"
      - "research/studies/**"
      - ".github/workflows/reusable-study-quality-gate.yml"
      - "tests/test_study_evaluation_gate.py"
      - "research/STUDY_EVALUATION_CONTRACT.md"
      - ".github/workflows/study-evaluation-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate study quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Show import-sorting patch for CI failure
        run: |
          python -m pip install ruff==0.16.10
          ruff check --select I --diff tests/test_study_evaluation_gate.py || true
      - name: Syntax validation
        run: python -m py_compile scripts/study_evaluation_gate.py scripts/check_study_registry.py tests/test_study_evaluation_gate.py tests/test_study_registry.py
      - name: Gate integration and negative tests
        run: |
          python -m unittest discover -s tests -p test_study_evaluation_gate.py -v
          python -m unittest discover -s tests -p test_study_registry.py -v
          python -m scripts.check_study_registry

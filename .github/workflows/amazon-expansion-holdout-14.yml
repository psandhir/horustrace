name: Amazon Expansion Holdout 14

on:
  workflow_dispatch:
  push:
    branches:
      - research/amazon-expansion-holdout-14
    paths:
      - ".github/workflows/amazon-expansion-holdout-14.yml"
      - "research/amazon-expansion-holdout-14/**"
  pull_request:
    paths:
      - ".github/workflows/amazon-expansion-holdout-14.yml"
      - "research/amazon-expansion-holdout-14/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: amazon-expansion-holdout-14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case_id:
          - amz-str-001
          - amz-str-002
          - amz-str-003
          - amz-str-ts-001
          - amz-br-cfn-001
          - amz-br-tf-001
          - amz-br-tf-002
          - amz-br-tf-003
          - amz-ac-json-001
          - amz-ac-json-002
          - amz-ac-json-003
          - amz-ac-json-004
          - amz-ac-tf-001
          - amz-ac-tf-002

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Generate frozen scan bundle
        run: |
          python research/amazon-expansion-holdout-14/run_case.py \
            --case-id "${{ matrix.case_id }}" \
            --output-dir artifacts
      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-expansion-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate Amazon holdout
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: amazon-expansion-case-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate
        run: |
          python research/amazon-expansion-holdout-14/aggregate.py --input downloaded --output aggregate
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: amazon-expansion-holdout-14-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

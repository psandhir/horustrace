name: Unseen ADK Pydantic Holdout 10

on:
  push:
    branches:
      - research/adk-pydantic-unseen-holdout-10
    paths:
      - ".github/workflows/framework-holdout-adk-pydantic-unseen-10.yml"

permissions:
  contents: read

concurrency:
  group: framework-holdout-adk-pydantic-unseen-10
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout HorusTrace
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HorusTrace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run locked unseen holdout
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          CASES = [
              ("rw-028","AhmadK-it/research_assistant","923bf68dde7186f7ecff050cc3513550b5f68b0d","google-adk"),
              ("rw-030","Piyushhpatel/aquagaurd-google-cloud-rapid","98c843300428b3b01a38e33a014dfbabc984d4fd","google-adk"),
              ("rw-032","allen-stephen/memory-bank-samples","ac7fdb1ed89f96c4f4e4d96548c09260e9e387da","google-adk"),
              ("rw-033","moonpy-a11y/agent_payments","b08e4bec80ea2f8a3664d670bc6fc52b8a50d1ae","google-adk"),
              ("rw-040","dwij2812/streamassist-datastorespec-example","c7ae87d8c45a55c2c678690269ec49c92801d4b8","google-adk"),
              ("rw-149","LeonieFreisinger/pydanticai-base-agent","0cf88a4caf2b5da29ff7af8364d4db14ac9e50b4","pydantic-ai"),
              ("rw-168","hypermemory-ai/openrouter_provider_validator","95eee5b0694ca7901526e6280f1a700760a7e7ba","pydantic-ai"),
              ("rw-170","Croups/smart-web-scraper","a157701a22ae1853a00156b2364830130958c82d","pydantic-ai"),
              ("rw-174","Unfold-Security/pydantic-collab","b35097cb7cb5f39cc3d098f51d819c1cfe3a0266","pydantic-ai"),
              ("rw-176","djaboxx/template-ai-chat-stack","d8f54cc067f387b4f6f1cb685266adca4111aadc","pydantic-ai"),
          ]

          def clone_case(root, case):
              case_id, repo, sha, framework = case
              target = root / case_id
              target.mkdir()
              commands = [
                  ["git","init","-q",str(target)],
                  ["git","-C",str(target),"remote","add","origin",f"https://github.com/{repo}.git"],
                  ["git","-C",str(target),"fetch","--quiet","--depth=1","--filter=blob:none","origin",sha],
                  ["git","-C",str(target),"checkout","--quiet","--detach","FETCH_HEAD"],
              ]
              for command in commands:
                  cp = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=240)
                  if cp.returncode:
                      raise RuntimeError((cp.stderr or cp.stdout)[-4000:])
              return target

          results=[]
          with tempfile.TemporaryDirectory(prefix="horustrace-unseen-holdout-") as temp:
              root=Path(temp)
              for index,case in enumerate(CASES,1):
                  case_id,repo_name,sha,framework=case
                  started=time.monotonic()
                  print(f"[{index:02d}/10] {case_id} {repo_name}", flush=True)
                  row={"case_id":case_id,"repo":repo_name,"sha":sha,"framework":framework}
                  try:
                      target=clone_case(root,case)
                      from horustrace.config import load_config
                      from horustrace.scanner import scan
                      graph,findings=scan(target,config=load_config(target))
                      row.update({
                          "scan":"ok",
                          "agents":[{
                              "name":agent.name,
                              "location":({"path":agent.location.path.as_posix(),"line":agent.location.line,"column":agent.location.column} if agent.location else None),
                              "runtime_viability":agent.metadata.get("runtime_viability"),
                              "runtime_blockers":agent.metadata.get("runtime_blockers") or [],
                              "inputs":[{"name":i.name,"trust":i.trust,"kind":i.kind,"metadata":i.metadata} for i in agent.inputs],
                              "mcp_servers":[{
                                  "name":s.name,"transport":s.transport,"url":s.url,"approval":s.approval,
                                  "tools":[t.name for t in s.tools],"metadata":s.metadata
                              } for s in agent.mcp_servers],
                              "tools":[{
                                  "name":t.name,"kind":t.kind,"capabilities":sorted(t.capabilities),
                                  "approval":t.approval,"guardrails":t.guardrails,
                                  "resources":[{
                                      "kind":r.kind,"selector":r.selector,"access":sorted(r.access),"metadata":r.metadata
                                  } for r in t.resources],
                                  "destinations":[{
                                      "target":d.target,"restricted":d.restricted,"metadata":d.metadata
                                  } for d in t.destinations],
                                  "metadata":t.metadata,
                              } for t in agent.tools],
                          } for agent in graph.agents],
                          "unbound_mcp_servers":[{
                              "name":s.name,"transport":s.transport,"url":s.url,"metadata":s.metadata
                          } for s in graph.unbound_mcp_servers],
                          "findings":[f.as_dict() for f in findings],
                          "attack_paths":[{
                              "path_id":p.path_id,"title":p.title,"agent":p.agent,"nodes":p.nodes,
                              "severity":p.severity.label(),"metadata":p.metadata
                          } for p in graph.attack_paths],
                          "diagnostics":[d.as_dict() for d in graph.coverage.diagnostics],
                      })
                  except Exception as exc:
                      row.update(scan="error",error=f"{type(exc).__name__}: {exc}")
                  row["elapsed_seconds"]=round(time.monotonic()-started,2)
                  results.append(row)
                  shutil.rmtree(root/case_id,ignore_errors=True)

          report={
              "schema_version":1,
              "study":"gpt-horustrace-differential-2026",
              "batch_id":"framework-holdout-adk-pydantic-unseen-10",
              "scanner_commit":os.environ.get("GITHUB_SHA"),
              "source_review_lock":"6435242b607234dcceea496ae0bec8e0728db08e",
              "results":results,
              "summary":{
                  "requested":10,
                  "scanned":sum(r.get("scan")=="ok" for r in results),
                  "errors":sum(r.get("scan")!="ok" for r in results),
                  "findings":sum(len(r.get("findings") or []) for r in results),
                  "attack_paths":sum(len(r.get("attack_paths") or []) for r in results),
              },
          }
          out=Path("research/gpt-horustrace-differential-2026/framework-holdout-adk-pydantic-unseen-10-scanner.json")
          out.write_text(json.dumps(report,indent=2,default=str)+"\n",encoding="utf-8")
          lines=[
              "# Unseen ADK + Pydantic AI 10-case scanner reveal","",
              f"- Scanner commit: \`{report['scanner_commit']}\`",
              f"- Source-review lock: \`{report['source_review_lock']}\`",
              f"- Scanned: **{report['summary']['scanned']}/10**",
              f"- Errors: **{report['summary']['errors']}**",
              f"- Findings: **{report['summary']['findings']}**",
              f"- Attack paths: **{report['summary']['attack_paths']}**","",
              "| Case | Framework | Findings | Paths | Bound MCP | Blocked agents |",
              "|---|---|---:|---:|---:|---:|",
          ]
          for row in results:
              agents=row.get("agents") or []
              mcp=sum(len(a.get("mcp_servers") or []) for a in agents)
              blocked=sum(a.get("runtime_viability")=="blocked_by_source_error" for a in agents)
              lines.append(f"| {row['case_id']} | {row['framework']} | {len(row.get('findings') or [])} | {len(row.get('attack_paths') or [])} | {mcp} | {blocked} |")
          Path("research/gpt-horustrace-differential-2026/framework-holdout-adk-pydantic-unseen-10-scanner.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Upload scanner reveal
        uses: actions/upload-artifact@v4
        with:
          name: framework-holdout-adk-pydantic-unseen-10
          path: |
            research/gpt-horustrace-differential-2026/framework-holdout-adk-pydantic-unseen-10-scanner.json
            research/gpt-horustrace-differential-2026/framework-holdout-adk-pydantic-unseen-10-scanner.md
          if-no-files-found: error

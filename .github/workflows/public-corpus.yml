name: Public Corpus Validation

on:
  workflow_dispatch:
  push:
    branches: [v0.4-hardening]
    paths:
      - "src/**"
      - "scripts/public_corpus_scan.py"
      - "pyproject.toml"
      - ".github/workflows/public-corpus.yml"

permissions:
  contents: read

concurrency:
  group: public-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan public corpus (${{ matrix.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tier: [application, framework-stress]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install HorusTrace
        run: python -m pip install -e .

      - name: Scan public corpus
        env:
          HORUSTRACE_CORPUS_TIER: ${{ matrix.tier }}
        run: python scripts/public_corpus_scan.py

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-corpus-report-${{ matrix.tier }}
          path: |
            public-corpus-report.json
            public-corpus-report.md
          if-no-files-found: warn

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact current scanner
        run: python -m pip install -e .
      - name: Scan pinned historical target
        env:
          CASE_ID: ${{ matrix.case_id }}
          REPO: ${{ matrix.repo }}
          TARGET_SHA: ${{ matrix.sha }}
          FRAMEWORK: ${{ matrix.framework }}
          SCOPE: ${{ matrix.scope }}
          COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          ROOT="/tmp/target"
          git init -q "$ROOT"
          git -C "$ROOT" remote add origin "https://github.com/$REPO.git"
          git -C "$ROOT" fetch --quiet --depth=1 --filter=blob:none origin "$TARGET_SHA"
          git -C "$ROOT" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from horustrace.config import load_config
          from horustrace.effective_authority import effective_authority_relationships
          from horustrace.scanner import scan

          root=Path("/tmp/target")
          rel=os.environ["SCOPE"]
          chosen=root if rel=="." else root/rel
          if not chosen.exists():
              raise SystemExit(f"scope missing: {rel}")
          scan_scope=chosen if chosen.is_dir() else chosen.parent
          graph, findings=scan(scan_scope, config=load_config(scan_scope))

          relationships=[]
          for item in effective_authority_relationships(graph):
              relationships.append({
                  "agent": item.agent,
                  "target_kind": item.target_kind,
                  "target_name": item.target_name,
                  "resolution": item.resolution,
                  "capabilities": sorted(item.capabilities),
              })

          row={
              "case_id":os.environ["CASE_ID"],
              "repo":os.environ["REPO"],
              "sha":os.environ["TARGET_SHA"],
              "framework":os.environ["FRAMEWORK"],
              "scope":rel,
              "cohort":os.environ["COHORT"],
              "scan_scope":str(scan_scope.relative_to(root)) if scan_scope != root else ".",
              "agents":[{
                  "name":a.name,
                  "framework":a.metadata.get("framework"),
                  "runtime_viability":a.metadata.get("runtime_viability"),
                  "tools":[{
                      "name":t.name,
                      "kind":t.kind,
                      "capabilities":sorted(t.capabilities),
                      "approval":t.approval,
                      "metadata":t.metadata,
                  } for t in a.tools],
                  "mcp_servers":[{
                      "name":m.name,
                      "transport":m.transport,
                      "url":m.url,
                      "metadata":m.metadata,
                  } for m in a.mcp_servers],
              } for a in graph.agents],
              "unbound_mcp_servers":[{
                  "name":m.name,
                  "transport":m.transport,
                  "url":m.url,
                  "metadata":m.metadata,
              } for m in graph.unbound_mcp_servers],
              "relationships":relationships,
              "findings":[f.as_dict() for f in findings],
              "attack_paths":[{
                  "path_id":p.path_id,
                  "title":p.title,
                  "agent":p.agent,
                  "nodes":p.nodes,
                  "severity":p.severity.label(),
                  "metadata":p.metadata,
              } for p in graph.attack_paths],
              "diagnostics":[d.as_dict() for d in graph.coverage.diagnostics],
          }
          row["counts"]={
              "agents":len(row["agents"]),
              "tools":sum(len(a["tools"]) for a in row["agents"]),
              "bound_mcp":sum(len(a["mcp_servers"]) for a in row["agents"]),
              "unbound_mcp":len(row["unbound_mcp_servers"]),
              "relationships":len(row["relationships"]),
              "findings":len(row["findings"]),
              "attack_paths":len(row["attack_paths"]),
          }
          out=Path("artifacts")/os.environ["CASE_ID"]
          out.mkdir(parents=True,exist_ok=True)
          (out/"result.json").write_text(json.dumps(row,indent=2,default=str)+"\n")
          print(json.dumps(row["counts"],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extra39-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: extra39-*
          path: downloaded
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path("downloaded").rglob("result.json")):
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:r["case_id"])
          summary={
              "scanner_sha":"1a18f809e3556f4423ebfb3fe054063ced0ecb8a",
              "requested":39,
              "completed":len(rows),
              "by_framework":{},
              "by_cohort":{},
              "zero_agent_cases":[],
              "rows":rows,
          }
          for row in rows:
              fw=summary["by_framework"].setdefault(row["framework"],{"cases":0,"agents":0,"tools":0,"mcp":0,"relationships":0,"findings":0,"paths":0})
              co=summary["by_cohort"].setdefault(row["cohort"],{"cases":0,"agents":0,"tools":0,"mcp":0,"relationships":0,"findings":0,"paths":0})
              for target in (fw,co):
                  target["cases"]+=1
                  target["agents"]+=row["counts"]["agents"]
                  target["tools"]+=row["counts"]["tools"]
                  target["mcp"]+=row["counts"]["bound_mcp"]+row["counts"]["unbound_mcp"]
                  target["relationships"]+=row["counts"]["relationships"]
                  target["findings"]+=row["counts"]["findings"]
                  target["paths"]+=row["counts"]["attack_paths"]
              if row["counts"]["agents"]==0:
                  summary["zero_agent_cases"].append(row["case_id"])
          Path("aggregate").mkdir()
          Path("aggregate/summary.json").write_text(json.dumps(summary,indent=2,default=str)+"\n")
          lines=["# ADK + Pydantic extra 39 historical regression","",
                 f"- Completed: **{len(rows)}/39**",
                 f"- Zero-agent cases: **{len(summary['zero_agent_cases'])}**",
                 f"- Zero-agent IDs: {', '.join(summary['zero_agent_cases']) or 'none'}","",
                 "| Cohort | Cases | Agents | Tools | MCP | Authority rels | Findings | Paths |",
                 "|---|---:|---:|---:|---:|---:|---:|---:|"]
          for name,x in sorted(summary["by_cohort"].items()):
              lines.append(f"| {name} | {x['cases']} | {x['agents']} | {x['tools']} | {x['mcp']} | {x['relationships']} | {x['findings']} | {x['paths']} |")
          lines += ["","| Case | Framework | Cohort | Agents | Tools | MCP | Rels | Findings | Paths |",
                    "|---|---|---|---:|---:|---:|---:|---:|---:|"]
          for r in rows:
              c=r["counts"]
              lines.append(f"| {r['case_id']} | {r['framework']} | {r['cohort']} | {c['agents']} | {c['tools']} | {c['bound_mcp']+c['unbound_mcp']} | {c['relationships']} | {c['findings']} | {c['attack_paths']} |")
          Path("aggregate/summary.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adk-pydantic-extra-39-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

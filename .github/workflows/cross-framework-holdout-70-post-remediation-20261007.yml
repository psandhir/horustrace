name: Fresh 70 Post Remediation

on:
  workflow_dispatch:
  push:
    branches:
      - research/cross-framework-holdout-70-post-remediation-20261007
    paths:
      - ".github/workflows/cross-framework-holdout-70-20261007.yml"
      - "research/cross-framework-holdout-70-20261007/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: cross-framework-holdout-70-20261007-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify scanner freeze and cohort integrity
        run: |
          freeze="b64d8211690e0f5c80c2631e4d7d11d5c40a525a"
          cohort="research/cross-framework-holdout-70-20261007/cohort.json"
          expected_blob="252bcb1a9a0a7d21b2c5949ee67ec281fa814f88"

          test "$(git hash-object "$cohort")" = "$expected_blob"
          git diff --exit-code "$freeze"...HEAD -- src/horustrace pyproject.toml

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          doc = json.loads(
              Path("research/cross-framework-holdout-70-20261007/cohort.json").read_text()
          )
          cases = doc["cases"]

          assert doc["scanner_freeze_sha"] == "b64d8211690e0f5c80c2631e4d7d11d5c40a525a"
          assert len(cases) == 70
          assert len({case["repo"].lower() for case in cases}) == 70
          assert Counter(case["framework"] for case in cases) == {
              "google-adk": 10,
              "pydantic-ai": 10,
              "openai-agents": 10,
              "amazon": 10,
              "anthropic": 10,
              "microsoft": 10,
              "fastagent": 10,
          }
          PY
      - id: matrix
        name: Build holdout matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          cases = json.loads(
              Path("research/cross-framework-holdout-70-20261007/cohort.json").read_text()
          )["cases"]
          print(
              "matrix="
              + json.dumps(
                  [case["case_id"] for case in cases],
                  separators=(",", ":"),
              )
          )
          PY

  scan:
    needs: prepare
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        case_id: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Generate holdout evidence bundle
        run: |
          python research/cross-framework-holdout-70-20261007/run_case.py \
            --case-id "${{ matrix.case_id }}" \
            --output-dir artifacts
      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hold70-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate holdout 70
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: hold70-case-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate holdout metrics
        run: |
          python research/cross-framework-holdout-70-20261007/aggregate.py \
            --input downloaded \
            --output aggregate
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-framework-holdout-70-post-remediation-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

name: ADK Cohort Three UX Reports

on:
  workflow_dispatch:
  push:
    branches:
      - report/adk-cohort-ux-three-*
    paths:
      - .github/workflows/adk-cohort-three-ux.yml
      - scripts/run_three_adk_cohort_ux.py

permissions:
  contents: read

concurrency:
  group: adk-cohort-three-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Three frozen Google ADK sources to offline HTML
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact scanner revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install only HorusTrace scanner
        run: python -m pip install -e .
      - name: Scan exact pinned external source and render HTML
        run: python scripts/run_three_adk_cohort_ux.py --output-dir artifacts/adk-cohort-ux-three
      - name: Install Chromium browser smoke dependencies
        run: |
          python -m pip install 'playwright>=1.56,<1.60'
          python -m playwright install --with-deps chromium
      - name: Verify navigation, agent drilldown, theme and browser errors
        run: |
          python scripts/run_three_adk_cohort_ux.py \
            --output-dir artifacts/adk-cohort-ux-three --verify-browser
      - name: Write direct GitHub Actions summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/adk-cohort-ux-three/summary.md ]; then
            cat artifacts/adk-cohort-ux-three/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download reports from this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload offline HTML reports, evidence and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-cohort-ux-three
          path: artifacts/adk-cohort-ux-three/
          if-no-files-found: warn
          retention-days: 30

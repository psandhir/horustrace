name: Skill LLM Calibration v1

on:
  push:
    branches:
      - study/skill-llm-calibration-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate study harness
        run: |
          ruff check scripts/skill_llm_calibration_study.py tests/test_skill_llm_calibration_study.py
          pytest -q tests/test_skill_llm_calibration_study.py tests/test_skill_llm_semantics.py
          python scripts/skill_llm_calibration_study.py --validate-only
      - name: Select semantic provider
        shell: bash
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo "STUDY_PROVIDER=openai" >> "$GITHUB_ENV"
            echo "STUDY_MODEL=gpt-6.1-sol" >> "$GITHUB_ENV"
            echo "Using OpenAI Responses API with gpt-6.1-sol"
          else
            echo "STUDY_PROVIDER=copilot" >> "$GITHUB_ENV"
            echo "STUDY_MODEL=gpt-6-sol" >> "$GITHUB_ENV"
            echo "OPENAI_API_KEY unavailable; using Copilot CLI with gpt-6-sol"
          fi
      - name: Install Copilot CLI fallback
        if: env.OPENAI_API_KEY == ''
        run: |
          npm install -g @github/copilot
          copilot --version
      - name: Run locked Skill semantic calibration
        run: |
          mkdir -p results .study-work
          python scripts/skill_llm_calibration_study.py \
            --provider "$STUDY_PROVIDER" \
            --model "$STUDY_MODEL" \
            --workspace .study-work \
            --cache .cache/skill-llm-calibration-v1.json \
            --output-json results/skill-llm-calibration-v1.json \
            --output-markdown results/skill-llm-calibration-v1.md \
            > /tmp/skill-llm-calibration-v1.json
      - name: Publish calibration summary to job log
        if: always()
        run: |
          if [[ -f results/skill-llm-calibration-v1.md ]]; then
            cat results/skill-llm-calibration-v1.md
          fi

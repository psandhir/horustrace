name: Generate Research Assistant visual report

on:
  push:
    branches:
      - experiment/visual-report-research-assistant

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HorusTrace
        uses: actions/checkout@v4

      - name: Check out target repository at study SHA
        uses: actions/checkout@v4
        with:
          repository: AhmadK-it/research_assistant
          ref: 923bf68dde7186f7ecff050cc3513550b5f68b0d
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HorusTrace
        run: python -m pip install -e .

      - name: Run JSON scan
        shell: bash
        run: |
          set +e
          horustrace scan target --format json > research-assistant-scan.json 2> research-assistant-scan.stderr
          code=$?
          echo "scan_exit_code=$code"
          cat research-assistant-scan.stderr
          exit 0

      - name: Summarize scan
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          data=json.load(open("research-assistant-scan.json"))
          findings=data.get("findings", [])
          graph=data.get("graph", {})
          print("agents:", len(graph.get("agents", [])))
          print("findings:", len(findings))
          print("severity:", dict(Counter(item.get("severity") for item in findings)))
          print("rules:", dict(Counter(item.get("rule_id") for item in findings)))
          for item in findings:
              print(item.get("rule_id"), item.get("severity"), item.get("agent"), item.get("title"))
          PY

      - name: Generate visual report
        run: horustrace report target --output research-assistant-horustrace-report.html

      - name: Upload report and scan
        uses: actions/upload-artifact@v4
        with:
          name: research-assistant-horustrace-visual-report
          path: |
            research-assistant-horustrace-report.html
            research-assistant-scan.json
            research-assistant-scan.stderr

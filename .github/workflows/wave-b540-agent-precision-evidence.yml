name: Wave B540 Agent Precision Source Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/wave-b540-agent-precision-evidence.yml'
      - 'scripts/real_world_agent_security_execute.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-b540-agent-precision-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-precision-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact scanner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify immutable original source truth and scanner SHA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/real_world_agent_security_study.py --validate-only
          echo "SCANNER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install current scanner without running target dependencies
        run: python -m pip install -e .
      - name: Export six contentious source-locked Graph inventories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/real_world_agent_security_execute.py \
            --mode postfix \
            --scanner "$(command -v horustrace)" \
            --scanner-sha "$SCANNER_SHA" \
            --workers 4 \
            --exclude-framework langgraph \
            --case-id rw-025 \
            --case-id rw-034 \
            --case-id rw-163 \
            --case-id rw-170 \
            --case-id rw-089 \
            --case-id rw-103 \
            --audit-agent-nodes \
            --output-json artifacts/source-locked-agent-precision-6.json \
            --output-markdown artifacts/source-locked-agent-precision-6.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/source-locked-agent-precision-6.json')
          report = json.loads(p.read_text(encoding='utf-8'))
          cases = report['cases']
          expected = {'rw-025', 'rw-034', 'rw-163', 'rw-170', 'rw-089', 'rw-103'}
          assert {c['case_id'] for c in cases} == expected
          rows = ['# Source-pinned agent precision audit', '', 'Scanner SHA: ' + report['scanner_sha'], '', '| Case | Status | Truth | Predicted | Agent nodes | Workflow nodes | Unmatched |', '|---|---|---:|---:|---:|---:|---:|']
          for case in cases:
              agent = case.get('comparisons', {}).get('agent_entities') or {}
              nodes = case.get('agent_node_audit') or []
              if case['status'] != 'success':
                  raise SystemExit(f"{case['case_id']}: pinned graph scan failed: {case.get('error')}")
              assert len(nodes) == agent['predicted']
              unmatched = [n for n in nodes if not n['matched_locked_reference']]
              assert len(unmatched) == agent['fp']
              rows.append(f"| {case['case_id']} | {case['status']} | {agent['truth']} | {agent['predicted']} | {sum(n['kind']=='agent' for n in nodes)} | {sum(n['kind']=='workflow_node' for n in nodes)} | {len(unmatched)} |")
          Path('artifacts/agent-precision-source-summary.md').write_text('\n'.join(rows) + '\n')
          print('\n'.join(rows))
          PY
      - name: Publish complete identity/type/source witnesses
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wave-b540-agent-precision-source-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

name: Agent-Centric Generalization 12

on:
  workflow_dispatch:
  push:
    branches:
      - research/agent-centric-generalization-12-final
    paths:
      - ".github/workflows/agent-centric-generalization-12.yml"
      - "research/agent-centric-generalization-12/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-centric-generalization-12
  cancel-in-progress: true

jobs:
  scan:
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case_id:
          - gen-adk-001
          - gen-adk-002
          - gen-adk-003
          - gen-adk-004
          - gen-pyd-001
          - gen-pyd-002
          - gen-pyd-003
          - gen-pyd-004
          - gen-oai-001
          - gen-oai-002
          - gen-oai-003
          - gen-oai-004

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Generate frozen scan bundle
        run: |
          python research/agent-centric-generalization-12/run_case.py             --case-id "${{ matrix.case_id }}"             --output-dir artifacts
      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-centric-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate agent-centric cohort
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-centric-case-*
          path: downloaded
      - name: Aggregate
        run: |
          python research/agent-centric-generalization-12/aggregate.py --input downloaded --output aggregate
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-centric-generalization-12-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

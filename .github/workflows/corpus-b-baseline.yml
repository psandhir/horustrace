name: Cohort B Baseline v0.4.1

on:
  workflow_dispatch:
  push:
    branches: [research/corpus-b-baseline]
    paths:
      - "benchmarks/public-corpus/cohort-b-v1.json"
      - "scripts/public_corpus_frozen_scan.py"
      - ".github/workflows/corpus-b-baseline.yml"

permissions:
  contents: read

concurrency:
  group: corpus-b-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Baseline ${{ matrix.category }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        category:
          - google-adk
          - openai-agents
          - langgraph
          - mcp-mixed

    steps:
      - name: Check out HorusTrace research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install released HorusTrace baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install "horustrace==0.4.1"
          horustrace --version

      - name: Scan frozen Cohort B
        run: |
          python scripts/public_corpus_frozen_scan.py \
            --manifest benchmarks/public-corpus/cohort-b-v1.json \
            --category "${{ matrix.category }}" \
            --output-prefix "cohort-b-v0.4.1-${{ matrix.category }}"

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cohort-b-v0.4.1-${{ matrix.category }}
          path: |
            cohort-b-v0.4.1-${{ matrix.category }}.json
            cohort-b-v0.4.1-${{ matrix.category }}.md
          if-no-files-found: warn

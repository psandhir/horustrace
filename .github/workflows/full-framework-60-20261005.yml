name: Full Framework 60 Study

on:
  workflow_dispatch:
  push:
    branches:
      - study/full-framework-60-20261005
    paths:
      - ".github/workflows/full-framework-60-20261005.yml"
      - "research/full-framework-60-20261005/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: full-framework-60-20261005
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Build frozen matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          doc = json.loads(Path("research/full-framework-60-20261005/cohort.json").read_text())
          print("matrix=" + json.dumps([case["case_id"] for case in doc["cases"]], separators=(",", ":")))
          PY

  scan:
    needs: prepare
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        case_id: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Generate full security evidence bundle
        run: |
          python research/full-framework-60-20261005/run_case.py \
            --case-id "${{ matrix.case_id }}" \
            --output-dir artifacts
      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ff60-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate full-framework cohort
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ff60-case-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate
        run: |
          python research/full-framework-60-20261005/aggregate.py \
            --input downloaded \
            --output aggregate
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: full-framework-60-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

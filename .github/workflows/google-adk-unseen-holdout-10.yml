name: Google ADK Unseen Holdout 10

on:
  workflow_dispatch:
  push:
    branches:
      - research/google-adk-unseen-holdout-10
    paths:
      - ".github/workflows/google-adk-unseen-holdout-10.yml"
      - "research/google-adk-unseen-holdout-10/**"
  pull_request:
    paths:
      - ".github/workflows/google-adk-unseen-holdout-10.yml"
      - "research/google-adk-unseen-holdout-10/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: google-adk-unseen-holdout-10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case_id:
          - gadk-hold-001
          - gadk-hold-002
          - gadk-hold-003
          - gadk-hold-004
          - gadk-hold-005
          - gadk-hold-006
          - gadk-hold-007
          - gadk-hold-008
          - gadk-hold-009
          - gadk-hold-010

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Generate frozen scan bundle
        run: |
          python research/google-adk-unseen-holdout-10/run_case.py \
            --case-id "${{ matrix.case_id }}" \
            --output-dir artifacts
      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-adk-holdout-case-${{ matrix.case_id }}
          path: artifacts/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate Google ADK holdout
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: google-adk-holdout-case-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate
        run: |
          python research/google-adk-unseen-holdout-10/aggregate.py --input downloaded --output aggregate
          cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: google-adk-unseen-holdout-10-summary
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

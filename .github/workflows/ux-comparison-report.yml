name: UX Comparison Report

on:
  push:
    branches:
      - ux/report-comparison-ai-companion
    paths:
      - ".github/workflows/ux-comparison-report.yml"

permissions:
  contents: read

jobs:
  report:
    name: Build ai-companion comparison report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out HorusTrace candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: horustrace

      - name: Check out comparison target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Danejw/ai-companion-backend
          path: target

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install HorusTrace candidate
        run: python -m pip install ./horustrace

      - name: Generate comparison report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          horustrace report ./target --output ./output/horustrace-report.html
          git -C target rev-parse HEAD > ./output/target-commit.txt
          git -C horustrace rev-parse HEAD > ./output/horustrace-commit.txt
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path("output/horustrace-report.html").read_text(encoding="utf-8")
          match = re.search(
              r'<script id="horus-data" type="application/json">(.*?)</script>',
              html,
              re.S,
          )
          if not match:
              raise SystemExit("embedded visual-report payload not found")
          data = json.loads(match.group(1))
          Path("output/summary.json").write_text(
              json.dumps(
                  {
                      "summary": data["summary"],
                      "agents": [
                          {
                              "name": item["name"],
                              "framework": item["framework"],
                              "summary": item["summary"],
                              "severity": item["severity"],
                          }
                          for item in data["agents"]
                      ],
                      "attack_paths": [
                          {
                              "agent": item.get("agent"),
                              "path_id": item.get("path_id"),
                              "title": item.get("title"),
                              "severity": item.get("severity"),
                              "basis": item.get("basis"),
                              "evidence_strength": item.get("evidence_strength"),
                          }
                          for agent in data["agents"]
                          for item in agent.get("path_views", [])
                      ],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("output/summary.json").read_text())
          s = data["summary"]
          print("## Danejw/ai-companion-backend")
          print()
          print(f"- Agents: **{s['agents']}**")
          print(f"- Tools: **{s['tools']}**")
          print(f"- MCP servers: **{s['mcp_servers']}**")
          print(f"- Findings: **{s['findings']}**")
          print(f"- Attack paths: **{s['attack_paths']}**")
          print(f"- Contract violations: **{s['contract_violations']}**")
          print(f"- Authority relationships: **{s['authority_relationships']}**")
          print(f"- Write-capable relationships: **{s['write_capable_relationships']}**")
          print(f"- Analysis incomplete: **{s['analysis_incomplete']}**")
          PY

      - name: Upload comparison report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: horustrace-ai-companion-ux-report
          path: output/
          if-no-files-found: error
          retention-days: 30

name: Wave B Amazon Third-Party Resolution Boundary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/wave-b540-third-party-resolution.yml"
      - "scripts/audit_wave_b540_dependency_resolution.py"
      - "tests/test_wave_b540_dependency_resolution.py"
      - "docs/wave-b540-third-party-dependency-resolution-20261018.md"

permissions:
  contents: read

concurrency:
  group: wave-b540-third-party-resolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attest-pinned-source:
    name: Source-verified third-party dependency resolution gap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: "30d03d7c9f6512e5bf10601879382fac9c3a16b1"
      SOURCE_REPO: "aws-samples/sample-multi-agent-region-expansion-planner"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: python -m pip install -e .
      - name: Enforce hard-negative source contract fixtures
        run: python -m pytest -q tests/test_wave_b540_dependency_resolution.py
      - name: Fetch immutable source Git tree and exact raw witnesses
        run: |
          set -euo pipefail
          mkdir -p pinned-source
          gh api "repos/$SOURCE_REPO/git/trees/$SOURCE_SHA?recursive=1" > pinned-source/tree.json
          for path in \
            requirements.txt \
            src/utils/config.py \
            src/agents/cfn_explorer.py \
            src/agents/pricing_explorer.py \
            src/agents/planning_report_generator.py \
            src/agents/multi_region_expansion_planner.py \
            src/agents/waypoint_explorer.py
          do
            mkdir -p "pinned-source/$(dirname "$path")"
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/$SOURCE_REPO/$SOURCE_SHA/$path" \
              -o "pinned-source/$path"
          done
      - name: Attest exact source bytes, identify missing runtime version evidence
        run: |
          set -euo pipefail
          python scripts/audit_wave_b540_dependency_resolution.py \
            --tree pinned-source/tree.json \
            --source-root pinned-source \
            --high research/accuracy-wave-b540-model-judge-20261015/high-severity-adjudication.json \
            --medium research/accuracy-wave-b540-model-judge-20261015/medium-severity-adjudication.json \
            --output evaluation/amazon-third-party-resolution-boundary.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = json.loads(Path("evaluation/amazon-third-party-resolution-boundary.json").read_text())
          assert p["full_tree_entry_count"] == 29
          assert p["exact_source_blob_count"] == 7
          assert p["historical_unresolved_claim_count"] == 12
          assert p["floating_uvx_servers"] == 2
          assert p["runtime_npx_remote_clients"] == 3
          assert p["installed_strands_agents_tools_version"] is None
          assert p["consent_bypass_enforced"] is None
          assert p["precision"] is None and p["recall"] is None
          assert not p["wave_b_go"] and not p["wave_c_go"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Amazon WAB-04 exact source dependency boundary\n")
              f.write(f"Verified pinned blobs: {p['exact_source_blob_count']}; "
                      f"dynamic MCP launchers: {p['mcp_stdio_launchers']} "
                      f"(uvx floating {p['floating_uvx_servers']}, "
                      f"npx remote {p['runtime_npx_remote_clients']}).\n")
              f.write("**12 model-source claims retain unresolved runtime effects/controls.** "
                      "No installed package hash, MCP runtime catalogue, independent TP/FP truth, or Wave B GO.\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wave-b540-third-party-resolution-boundary
          path: evaluation/
          if-no-files-found: error
          retention-days: 30

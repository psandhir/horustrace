[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horustrace"
version = "0.9.0"
description = "Effective-authority, policy and deployed least-privilege analysis for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HorusTrace contributors" }]
keywords = ["ai-security", "agents", "mcp", "openai", "google-adk", "pydantic-ai", "fast-agent", "gcp", "security", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0.3,<7"]

[project.urls]
Homepage = "https://github.com/psandhir/horustrace"
Repository = "https://github.com/psandhir/horustrace"
Issues = "https://github.com/psandhir/horustrace/issues"
Security = "https://github.com/psandhir/horustrace/security/policy"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<8", "ruff>=0.12,<1"]

[project.scripts]
horustrace = "horustrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
branch = true
source = ["horustrace"]

[tool.coverage.report]
show_missing = true
skip_covered = true
